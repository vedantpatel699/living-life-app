<style>
:root{--surface-outer:#E6EFF6;--surface-cream:#FAF6EE;--surface-white:#FFFFFF;--surface-sky:#E0EBF4;--ink:#1A1F2E;--muted:#7C8497;--faint:#B7BCC9;--coral:#ED7A4D;--coral-s:#F8D9C9;--sky:#6DA9D6;--sky-s:#D2E2EF;--sun:#F2C84B;--sun-s:#FBEBB6;--mint:#8CCB9C;--mint-s:#D5EBDA;--cta:#0F0F12;--border:#D9DFE6;--border-l:#E8EBF0;--success:#4DA869;--success-s:#E8F3EC;--strava:#FC5200;--danger:#E26060;--r-sm:12px;--r-md:18px;--r-lg:24px;--r-xl:32px;--sh-card:0 2px 12px rgba(26,31,46,0.04);--sh-elev:0 8px 24px rgba(26,31,46,0.08);--sh-up:0 -4px 16px rgba(26,31,46,0.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:contain}
body{font-family:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-outer);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
input,textarea,button,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink);text-decoration:none}
#root{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--surface-cream)}
.status-bar{min-height:64px;padding:calc(max(16px,env(safe-area-inset-top)) + 8px) 24px 10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.status-bar .time{font-size:15px;font-weight:600}
.status-bar .icons{font-size:13px;font-weight:600;opacity:0.85;letter-spacing:2px}
.top-bar{display:flex;align-items:center;gap:14px;padding:14px 20px 8px;flex-shrink:0}
.back-btn{width:44px;height:44px;border-radius:22px;background:var(--surface-white);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink);flex-shrink:0}

.top-bar .title-block{flex:1;min-width:0}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
main.with-nav{padding-bottom:110px}
h1.pt{font-size:30px;font-weight:700;letter-spacing:-0.02em;padding:4px 0}
h2.sec{font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--muted);margin:24px 0 12px;text-transform:uppercase}

.card{background:var(--surface-white);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh-card)}

<script>
'use strict';
const STORAGE_KEY='living-life-config-v2',DATA_KEY='living-life-data-v2',APP_VERSION='4.1.0';
const ACTIVITIES=['Walk','Strength workout','Run','Yoga / stretch','Amazon shift','Rest day'];
const SUPPLEMENTS=[
  {id:'creatine',name:'Creatine monohydrate',dose:'5 g',timing:'anytime',color:'coral',ini:'C'},
  {id:'whey',name:'Whey protein',dose:'25-50 g',timing:'post-workout / breakfast',color:'sun',ini:'W'},
  {id:'d3',name:'Vitamin D3',dose:'2000 IU',timing:'with breakfast (fat)',color:'sky',ini:'D'},
  {id:'b12',name:'Methylcobalamin B12',dose:'500 µg',timing:'sublingual, anytime',color:'mint',ini:'B'},
  {id:'omega3',name:'Algal omega-3',dose:'500 mg EPA+DHA',timing:'with breakfast',color:'sky',ini:'O'},
];

// =================== DATABASE LOADERS ===================
const DB_BASE='https://raw.githubusercontent.com/vedantpatel699/living-life-app/main/data/';
const DB={foods:null,supplements:null,foodsBySlug:{},_loading:{},_err:{}};
function loadDB(name){
  if(DB[name])return Promise.resolve(DB[name]);
  if(DB._loading[name])return DB._loading[name];
  DB._loading[name]=(async()=>{
    try{
      const r=await fetch(DB_BASE+name+'.json',{cache:'no-cache'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DB[name]=await r.json();
      DB._err[name]=null;
      if(name==='foods'){DB.foodsBySlug={};for(const f of DB.foods.foods){DB.foodsBySlug[f.id]=f}
        // v3.34 — one-shot backfill: prior to v3.34, openEditFoodGrams didn't rescale
        // leucine_g/selenium_ug when grams changed, so edited entries kept stale values.
        // Recompute from the DB using each entry's current grams. Idempotent.
        try{
          if(!state.data.nutrientBackfillV2){
            let fixed=0;
            for(const d in (state.data.entries||{})){
              const ent=state.data.entries[d];if(!ent?.foods)continue;
              for(const fe of ent.foods){
                if(!fe.foodId||typeof fe.grams!=='number')continue;
                const db=DB.foodsBySlug[fe.foodId];if(!db)continue;
                const g=fe.grams;
                if(typeof db.leucine_g==='number'){const v=+((db.leucine_g||0)*g/100).toFixed(2);if(fe.leucine_g!==v){fe.leucine_g=v;fixed++}}
                if(typeof db.selenium_ug==='number'){const v=+((db.selenium_ug||0)*g/100).toFixed(2);if(fe.selenium_ug!==v){fe.selenium_ug=v;fixed++}}
              }
            }
            state.data.nutrientBackfillV2=true;
            saveLocalData();
            // v3.35 — also fix the live edit draft if user is on Log Entry; otherwise the screen shows stale values
            try{
              if(state.draft?.le?.foods){
                for(const fe of state.draft.le.foods){
                  if(!fe.foodId||typeof fe.grams!=='number')continue;
                  const db=DB.foodsBySlug[fe.foodId];if(!db)continue;
                  const g=fe.grams;
                  if(typeof db.leucine_g==='number'){fe.leucine_g=+((db.leucine_g||0)*g/100).toFixed(2)}
                  if(typeof db.selenium_ug==='number'){fe.selenium_ug=+((db.selenium_ug||0)*g/100).toFixed(2)}
                }
              }
            }catch(_){}
            if(fixed>0){
              console.log('v3.34 nutrient backfill: corrected',fixed,'leucine/selenium values');
              if(isConfigured())pushData().catch(e=>console.warn('backfill push failed',e));
              if(typeof render==='function')render();
            }
          }
        }catch(e){console.warn('nutrient backfill err',e)}
      }
      return DB[name];
    }catch(e){console.warn('DB load',name,e);DB._err[name]=e.message||String(e);return null}
    finally{delete DB._loading[name]}
  })();
  return DB._loading[name];
}
async function loadAllDB(){await Promise.all(['foods','supplements'].map(loadDB))}

// Today's supplement schedule — picks shift schedule on shift days, daily schedule otherwise.
// A "training day" = a shift day OR a day where Health Connect logged a workout.
function todaySuppSchedule(){
  if(!DB.supplements)return null;
  const shift=isShiftDay();
  const hc=getHCToday()||{};
  const hcWorkouts=(hc.workouts||[]);
  const isTrainingDay=shift||hcWorkouts.length>0;
  const isRunDay=hcWorkouts.some(w=>{const t=(w.type||w.title||'').toLowerCase();return t.includes('run')||t.includes('jog')||t.includes('c25k')});
  // On shift days, prefer shiftSchedule if defined
  const source=(shift&&DB.supplements.shiftSchedule)?DB.supplements.shiftSchedule:DB.supplements.dailySchedule;
  const slots=source.map(slot=>{
    const items=slot.include.map(id=>{
      const s=DB.supplements.supplements.find(x=>x.id===id);
      if(!s)return null;
      // Electrolytes only on actual workout/run days
      if(s.id==='electrolytes'&&!isTrainingDay)return null;
      if(s.frequency==='training-days-only'&&!isTrainingDay)return null;
      if(s.frequency==='run-days-only'&&!isRunDay)return null;
      return s;
    }).filter(Boolean);
    if(slot.conditional==='training-day'&&!isTrainingDay)return null;
    if(slot.conditional==='workout-day'&&!isTrainingDay)return null;
    if(items.length===0)return null;
    return{...slot,items};
  }).filter(Boolean);
  return slots;
}

const ICONS={
  today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
  bio:'<svg viewBox="0 0 24 24"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"/></svg>',

// v4.0 — DUAL RING: outer single-color arc + inner stacked-segment arc (passive + active kcal in
// two hues of the same color). Compositionally cleaner than two separate single-value rings.
function gfDualRing({outerValue=0,outerGoal=10000,outerLabel='STEPS',outerColor='var(--ink)',
  innerSegments=[],innerGoal=2000,innerLabel='',size=220,thickOuter=10,thickInner=14}){
  // outerSegments: simple progress vs goal
  // innerSegments: array of { value, color } stacked toward innerGoal
  const cx=size/2,cy=size/2;
  const rOuter=(size-thickOuter)/2;
  const rInner=rOuter-thickOuter/2-thickInner/2-4;
  const circOuter=2*Math.PI*rOuter;
  const circInner=2*Math.PI*rInner;
  const pctOuter=Math.min(1,outerGoal>0?outerValue/outerGoal:0);
  // Inner: compute cumulative dashOffsets so each segment starts where the previous ended
  const innerTotal=innerSegments.reduce((s,seg)=>s+(seg.value||0),0);
  let cumStart=0;
  const innerArcs=innerSegments.map(seg=>{
    const len=Math.min(seg.value/innerGoal,1-cumStart);
    const start=cumStart;
    cumStart+=len;
    return {dasharray:`${len*circInner} ${circInner}`,dashoffset:-start*circInner,color:seg.color};
  });
  const outerNum=outerValue>=10000?(outerValue/1000).toFixed(1)+'k':Math.round(outerValue).toLocaleString();
  return `<div style="width:${size}px;height:${size}px;position:relative;margin:0 auto">
<svg viewBox="0 0 ${size} ${size}" style="position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)">
<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="var(--surface-cream)" stroke-width="${thickOuter}"/>
<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="${outerColor}" stroke-width="${thickOuter}" stroke-linecap="round" stroke-dasharray="${pctOuter*circOuter} ${circOuter}" style="transition:stroke-dasharray 0.6s ease-out"/>
<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--surface-cream)" stroke-width="${thickInner}"/>
${innerArcs.map(a=>`<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="${a.color}" stroke-width="${thickInner}" stroke-linecap="round" stroke-dasharray="${a.dasharray}" stroke-dashoffset="${a.dashoffset}" style="transition:stroke-dasharray 0.6s ease-out"/>`).join('')}
</svg>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px">
<div style="font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1;color:${outerColor}">${outerNum}</div>
<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:6px">${outerLabel}</div>
${innerLabel?`<div class="tiny faint" style="margin-top:4px">${innerLabel}</div>`:''}

</div>`;
}

async function ghRequest(method,path,body){
  const url=`https://api.github.com/repos/${state.config.githubOwner}/${state.config.githubRepo}/${path}`;
  const res=await fetch(url,{method,headers:{'Authorization':`Bearer ${state.config.githubToken}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(res.status===404)return{notFound:true};
  if(!res.ok){const txt=await res.text();throw new Error(`GitHub ${res.status}: ${txt.slice(0,180)}`)}
  return res.json();
}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){try{return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}catch(e){return''}}
async function ghGetFile(path){const b=state.config.branch||'main';return ghRequest('GET',`contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${b}`)}
async function ghPutFile(path,c,m,sha){const b=state.config.branch||'main';const body={message:m,content:c,branch:b};if(sha)body.sha=sha;return ghRequest('PUT',`contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`,body)}
async function pullData(){if(!isConfigured())throw new Error('Not configured');state.isSyncing=true;try{const r=await ghGetFile('data/log.json');if(r.notFound){state.dataSha=null}else{const parsed=JSON.parse(b64dec(r.content));state.data=Object.assign(state.data,parsed);state.dataSha=r.sha}migrateData();saveLocalData();state.lastSyncOk=nowIso()}finally{state.isSyncing=false}}
async function pushData(){
  if(!isConfigured())throw new Error('Not configured');
  state.isSyncing=true;
  try{
    const doPush=async()=>{
      const enc=b64enc(JSON.stringify(state.data,null,2));
      return await ghPutFile('data/log.json',enc,`update ${today()}`,state.dataSha);
    };
    let r;
    try{
      r=await doPush();
    }catch(err){
      // v3.35 — SHA conflict (409): pull fresh remote, merge in any entries we don't have, retry once
      if(String(err.message||err).includes('409')){
        console.warn('pushData 409 — refreshing sha + merging remote, retrying once');
        const fresh=await ghGetFile('data/log.json');
        if(fresh&&!fresh.notFound){
          try{
            const remote=JSON.parse(b64dec(fresh.content));
            for(const d in (remote.entries||{})){
              if(!state.data.entries[d])state.data.entries[d]=remote.entries[d];
            }
            // Merge customFoods + mealTemplates as well (additive)
            const mergeArr=(localArr,remoteArr,keyFn)=>{
              if(!Array.isArray(remoteArr))return localArr||[];
              const out=Array.isArray(localArr)?[...localArr]:[];
              const have=new Set(out.map(keyFn));
              for(const item of remoteArr){if(!have.has(keyFn(item)))out.push(item)}
              return out;
            };
            state.data.customFoods=mergeArr(state.data.customFoods,remote.customFoods,x=>x.id);
            state.data.mealTemplates=mergeArr(state.data.mealTemplates,remote.mealTemplates,x=>x.id);
          }catch(e){console.warn('merge remote failed',e)}
          state.dataSha=fresh.sha;
          r=await doPush();
        }else{
          throw err;
        }
      }else{
        throw err;
      }
    }
    state.dataSha=r.content.sha;
    saveLocalData();
    state.lastSyncOk=nowIso();
  }finally{
    state.isSyncing=false;
  }
}

// GI is intensive (not portion-scaled) — look it up from DB.foodsBySlug when computing GL.
// Returns null fields when no data available (avoids "0" when nothing was logged).
function nutritionTotalsForDay(iso){
  const e=state.data.entries[iso];
  if(!e||!e.foods||e.foods.length===0)return {leucine:null,selenium:null,glycemicLoad:null};
  let leu=0,sel=0,gl=0,hasLeu=false,hasSel=false,hasGl=false;
  for(const food of e.foods){
    if(typeof food.leucine_g==='number'){leu+=food.leucine_g;hasLeu=true}
    if(typeof food.selenium_ug==='number'){sel+=food.selenium_ug;hasSel=true}
    // GL contribution = GI × food.carbs(g) / 100  — entry.carbs already has portion-adjusted carbs
    const dbFood=DB.foodsBySlug?.[food.foodId];
    const gi=dbFood?.glycemic_index;
    if(gi!=null && typeof food.carbs==='number'){gl+=gi*food.carbs/100;hasGl=true}
  }
  return {leucine:hasLeu?leu:null,selenium:hasSel?sel:null,glycemicLoad:hasGl?gl:null};
}
// Color band per RESEARCH_FOUNDATION §nutrition + spec doc.
// leucine: red<8, amber 8-10, green>=10  (Witard 2014 MPS-min 2.5g/meal × 4 meals = 10g/day)
// selenium: amber<55, green 55-400, red>400 (toxicity ceiling)
// gl: green<100, amber 100-120, red>120
function nutritionBand(metric,v){
  if(v==null)return 'gray';
  if(metric==='leucine')return v<8?'red':v<10?'amber':'green';
  if(metric==='selenium')return v<55?'amber':v<=400?'green':'red';
  if(metric==='glycemicLoad'||metric==='gl')return v<100?'green':v<=120?'amber':'red';
  return 'gray';
}

}

// Increment usage count + record time-of-day on every food log. Used to sort food picker so

function recordFoodUsage(foodId){
  if(!foodId)return;
  state.data.frequencyPattern=state.data.frequencyPattern||{};
  const fp=state.data.frequencyPattern;
  const e=fp[foodId]||{count:0,byHour:{}};
  e.count=(e.count||0)+1;
  e.lastLogged=nowIso();
  const hr=new Date().getHours();
  e.byHour[hr]=(e.byHour[hr]||0)+1;
  fp[foodId]=e;
  saveLocalData();
}

function addWaterEntry(ml){
  if(!ml||ml<=0)return;
  const t=today();
  const e=state.data.entries[t]||{};
  e.foods=e.foods||[];
  // Calgary Tap Water nutrient profile per 100g (= 100ml)
  const W={kcal:0,protein:0,carbs:0,fat:0,sodium_mg:2,potassium_mg:1,calcium_mg:56,magnesium_mg:16};
  const f=ml/100;
  const portionName=ml===250?'1 glass (250ml)':ml===500?'1 bottle (500ml)':ml===240?'1 cup (240ml)':ml===1000?'1 liter (1000ml)':ml+'ml (custom)';
  e.foods.push({foodId:'calgary-tap-water',name:'Calgary Tap Water',portionName,grams:ml,kcal:0,protein:0,carbs:0,fat:0,sodium_mg:+(W.sodium_mg*f).toFixed(2),potassium_mg:+(W.potassium_mg*f).toFixed(2),calcium_mg:+(W.calcium_mg*f).toFixed(1),magnesium_mg:+(W.magnesium_mg*f).toFixed(1)});
  e.updatedAt=nowIso();
  state.data.entries[t]=e;
  saveLocalData();
  nativeHaptic('light');
  render();
  // Best-effort background syncs (don't block UI)
  pushData().catch(err=>console.warn('water sync',err));
  writeHydrationToHC(ml,t).catch(()=>{});
}

function bindProgress(){

  if(!DB.foods){loadDB('foods').then(r=>{if(r&&state.screen==='progress')render()}).catch(()=>{})}
  // Render hero + every sparkline through the graph engine. data-spark-metric drives metric choice.
  setTimeout(()=>{
    const hero=document.getElementById('w-chart');
    if(hero)buildMetricChart(hero,{metric:'weight',mode:'hero'});
    document.querySelectorAll('canvas[data-spark-metric]').forEach(c=>{
      buildMetricChart(c,{metric:c.dataset.sparkMetric,mode:'spark'});
    });
  },50);
  // Every element with data-metric (hero, stat, sub-row) routes to metric detail
  // Nutrition metrics get per-food breakdown modal (more useful than a trend chart)
  const NUTRITION_METRICS=new Set(['leucine','selenium','glycemic_load']);

    const photos=Object.entries(state.data.entries).filter(([d,e])=>pickKey(e)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,4).map(([d,e])=>[d,pickKey(e)]);
    if(photos.length===0){grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:24px;text-align:center;color:var(--faint);font-size:12px">No '+pside+' photos yet.</div>';return}
    grid.innerHTML=photos.map(([d,p])=>`<div class="pcell" data-d="${d}" data-p="${p}" style="aspect-ratio:3/4;background:var(--surface-sky);border-radius:10px;overflow:hidden;position:relative;cursor:pointer"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint)">…</div><div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:10px 4px 4px;font-size:9px;font-weight:600;color:white;text-align:center">${fmtDate(d)}</div></div>`).join('');

  };
  renderPhotos();
  document.querySelectorAll('.p-side-btn').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    pside=b.dataset.pside;

// v3.18 — drill-down for the Nutrition Today rows. Shows per-food contribution + 7-day trend bar chart.
function openNutritionBreakdown(metric,iso){
  // Accept either snake_case (glycemic_load from METRIC_DEFS) or camelCase (legacy)
  if(metric==='glycemic_load')metric='glycemicLoad';
  const cfg={
    leucine:{label:'Leucine',unit:'g',target:10,fmt:v=>v.toFixed(2),blurb:'Witard 2014: 2.5g leucine per meal is the MPS-stimulation minimum. ~10g/day total spread over 4 meals is the practical aim.'},
    selenium:{label:'Selenium',unit:'µg',target:55,fmt:v=>v.toFixed(1),blurb:'55µg/day RDA. SSRI users: keep dietary intake adequate but avoid high-dose supplements (interaction risk).'},
    glycemicLoad:{label:'Glycemic Load',unit:'GL',target:100,fmt:v=>v.toFixed(0),blurb:'Daily GL <100 = low-impact pattern. 100-120 borderline. >120 elevates metabolic risk, esp. on shift work.'}
  }[metric]||{label:metric,unit:'',target:0,fmt:v=>String(v),blurb:''};
  const targetIso = iso || today();
  const todayIso = today();  // kept for the 7-day strip orientation
  const nut=nutritionTotalsForDay(targetIso);
  const targetVal=metric==='glycemicLoad'?nut.glycemicLoad:nut[metric];
  // Per-food contribution for the target day
  const entry=state.data.entries[targetIso];
  const foods=(entry?.foods||[]).map(f=>{
    let v=null;
    if(metric==='leucine')v=f.leucine_g;
    else if(metric==='selenium')v=f.selenium_ug;
    else if(metric==='glycemicLoad'){
      const db=DB.foodsBySlug?.[f.foodId];
      if(db?.glycemic_index!=null && typeof f.carbs==='number')v=db.glycemic_index*f.carbs/100;
    }
    return {name:f.name,portion:f.portionName,value:v||0};
  }).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  // 7-day history
  const hist=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const t=nutritionTotalsForDay(iso);
    const v=metric==='glycemicLoad'?t.glycemicLoad:t[metric];
    hist.push({iso,date:d,value:v});
  }
  const maxHist=Math.max(cfg.target,...hist.map(h=>h.value||0))||cfg.target;
  const band=nutritionBand(metric,targetVal);
  const color=nutritionBandColor(band);
  const m=document.createElement('div');m.className='modal-bg';
  m.innerHTML=`<div class="modal"><div class="modal-handle"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
    <h2 style="font-size:20px;font-weight:700">${cfg.label}</h2>
    <button id="nb-x" class="back-btn" style="width:36px;height:36px;font-size:16px">×</button>
  </div>
  <div class="tiny muted" style="margin-bottom:2px">${targetIso===todayIso?'Today':fmtDateLong(targetIso)}</div>
  <div style="font-size:32px;font-weight:700;color:${color};letter-spacing:-0.02em">${targetVal!=null?cfg.fmt(targetVal):'—'} <span class="tiny faint" style="font-weight:500">/ ${cfg.target} ${cfg.unit}</span></div>
  <p class="tiny muted" style="margin-top:4px">${band==='red'?'below target':band==='amber'?'getting there':band==='green'?'on target':'no data'}</p>
  <h3 class="mt-4" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)">Last 7 days</h3>
  <div style="display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:10px;padding:0 2px">
    ${hist.map(h=>{const v=h.value||0;const hp=Math.max(2,Math.round((v/maxHist)*72));const isToday=h.iso===todayIso;const b=nutritionBand(metric,v);const c=v?nutritionBandColor(b):'var(--border-l)';return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:${hp}px;background:${c};border-radius:3px;${isToday?'outline:2px solid var(--ink);outline-offset:1px':''}"></div><div class="tiny faint">${h.date.toLocaleDateString(undefined,{weekday:'narrow'})}</div></div>`}).join('')}
  </div>
  <h3 class="mt-4" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)">Biggest contributors</h3>
  ${foods.length===0?'<p class="tiny muted mt-2">No foods contributing yet.</p>':`<div style="margin-top:10px">
    ${foods.map(f=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-l)"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${escapeHtml(f.name)}</div><div class="tiny faint">${escapeHtml(f.portion||'')}</div></div><div style="font-weight:700;font-size:13px;color:${color}">${cfg.fmt(f.value)} ${cfg.unit}</div></div>`).join('')}
  </div>`}
  <p class="tiny faint" style="margin-top:16px;line-height:1.5">${escapeHtml(cfg.blurb)}</p>
  </div>`;
  m.addEventListener('click',ev=>{if(ev.target===m)m.remove()});
  m.querySelector('#nb-x').addEventListener('click',()=>m.remove());
  document.body.appendChild(m);
}

      ${items.map(f=>{const conf=foodConfidence(f);const badge=conf==='low'?`<span class="conf-q" data-conf-q="1" style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#FCE5E5;color:#E63946;font-size:9px;font-weight:700;margin-left:4px;cursor:pointer" title="Restaurant estimate or AI blend — actual values may vary">?</span>`:'';return `<div class="tiny muted" style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-l)"><span>${escapeHtml(f.name)} · ${escapeHtml(f.portionName)}</span><span>${f.kcal} kcal${badge} · ${(f.protein||0).toFixed(1)}g P</span></div>`}).join('')}
    </div>`;

  const totalKcal=(e.foods||[]).reduce((s,f)=>s+(f.kcal||0),0);
  m.innerHTML=`<div class="modal"><div class="modal-handle"></div>
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
<h2 style="font-size:20px;font-weight:700">${fmtDateLong(d)}</h2>

</div>

${(e.photoFront||e.photo||e.photoSide)?'<div id="mp" style="margin:16px 0;display:grid;grid-template-columns:'+((e.photoFront||e.photo)&&e.photoSide?'1fr 1fr':'1fr')+';gap:6px;min-height:100px;background:var(--surface-sky);border-radius:var(--r-md);overflow:hidden;color:var(--faint)">Loading…</div>':''}
<div class="grid-2 mt-4">

async function callClaude(messages,sys,maxTok=1500){

// v3.24 — week is Sunday-to-Saturday, month is calendar month. Offset shifts back (negative).
function metricRangeBounds(period,offset){
  const t=new Date();t.setHours(0,0,0,0);
  if(period==='week'){
    // Find Sunday of current week
    const sunday=new Date(t);sunday.setDate(t.getDate()-t.getDay());
    sunday.setDate(sunday.getDate()+(offset*7));
    const saturday=new Date(sunday);saturday.setDate(sunday.getDate()+6);
    return {start:sunday,end:saturday};
  }else{
    const first=new Date(t.getFullYear(),t.getMonth()+offset,1);
    const last=new Date(t.getFullYear(),t.getMonth()+offset+1,0);
    return {start:first,end:last};
  }
}
function metricRangeLabel(period,offset){
  const {start,end}=metricRangeBounds(period,offset);
  if(period==='week'){
    const sameMonth=start.getMonth()===end.getMonth();
    if(sameMonth)return start.toLocaleDateString(undefined,{month:'short'})+' '+start.getDate()+'–'+end.getDate();
    return start.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+end.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  return start.toLocaleDateString(undefined,{month:'long',year:'numeric'});
}

// v3.24 — pull a value for a metric on a given ISO date. Null = no data, NOT zero.
function metricValueFor(metric,iso){
  const e=state.data.entries[iso];
  if(!e)return null;
  if(metric==='weight')return typeof e.weight==='number'?e.weight:null;
  if(metric==='waist')return typeof e.waist_cm==='number'?e.waist_cm:null;
  if(metric==='protein'){const foods=e.foods||[];const v=foods.reduce((s,f)=>s+(f.protein||0),0);return foods.length>0?v:null}
  if(metric==='energy_net'){
    const foods=e.foods||[];if(foods.length===0)return null;
    const intake=foods.reduce((s,f)=>s+(f.kcal||0),0);
    // BMR for the day (estimate using current profile + weight)
    const wt=(typeof e.weight==='number')?e.weight:currentWeight();
    const p=state.profile;
    const bmr24=10*wt+6.25*p.heightCm-5*p.age+(p.sex==='female'?-161:5);
    const active=e.hc?.active_calories||0;
    return Math.round(intake-(bmr24+active));
  }
  if(metric==='active_kcal')return e.hc?.active_calories??null;
  if(metric==='steps')return e.hc?.steps??null;
  if(metric==='distance')return e.hc?.distance_km??null;
  if(metric==='rhr')return e.hc?.resting_heart_rate??null;
  if(metric==='hr_avg')return e.hc?.hr_avg??e.hc?.heart_rate??null;  // workout HR avg, falling back to aggregated latest
  if(metric==='hrv')return e.hc?.hrv_rmssd_avg??e.hc?.heart_rate_variability??null;  // native Sleep plugin first, fallback to aggregated
  if(metric==='vo2_max')return e.hc?.vo2_max??null;
  if(metric==='leucine'){const v=(e.foods||[]).reduce((s,f)=>s+(f.leucine_g||0),0);return v>0?v:null}
  if(metric==='selenium'){const v=(e.foods||[]).reduce((s,f)=>s+(f.selenium_ug||0),0);return v>0?v:null}
  if(metric==='glycemic_load'){
    let gl=0,has=false;
    for(const f of (e.foods||[])){
      const db=DB.foodsBySlug?.[f.foodId];const gi=db?.glycemic_index;
      if(gi!=null&&typeof f.carbs==='number'){gl+=gi*f.carbs/100;has=true}
    }
    return has?gl:null;
  }
  return null;
}
// v3.24 — pull last N days of values as a series (newest last). Used for sparklines.
function metricSeries(metric,days){
  const out=[];
  const t=new Date();t.setHours(0,0,0,0);
  for(let i=days-1;i>=0;i--){
    const d=new Date(t);d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    out.push(metricValueFor(metric,iso));
  }
  return out;
}
// v3.24 — avg/total across the last N days (null when no data).
function metricAvg(metric,days){const s=metricSeries(metric,days).filter(v=>v!=null);if(s.length===0)return null;return s.reduce((a,b)=>a+b,0)/s.length}
function metricSum(metric,days){const s=metricSeries(metric,days).filter(v=>v!=null);if(s.length===0)return null;return s.reduce((a,b)=>a+b,0)}

// v3.27 — GRAPH ENGINE. Single function renders any metric in any context.
// Driven entirely by METRIC_DEFS — adding a metric just needs an entry + a metricValueFor case.
// modes: 'spark' (no axes, MA line only), 'hero' (30-day, daily dots + MA, light axis), 'detail' (period+offset, full).
function buildMetricChart(canvas,opts){
  if(!canvas||!window.Chart)return null;
  const {metric,period='week',offset=0,mode='detail'}=opts||{};
  const def=METRIC_DEFS[metric];
  if(!def)return null;
  const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let days,xLabelFor;
  if(mode==='spark'){
    const t=new Date();t.setHours(0,0,0,0);days=[];for(let i=6;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);days.push(d)}
    xLabelFor=()=>'';
  }else if(mode==='hero'){
    const t=new Date();t.setHours(0,0,0,0);days=[];for(let i=29;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);days.push(d)}
    xLabelFor=(d,i)=>(i===0||i===days.length-1||i%6===0)?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
  }else{
    const {start,end}=metricRangeBounds(period,offset);
    days=[];const cur=new Date(start);cur.setHours(0,0,0,0);while(cur<=end){days.push(new Date(cur));cur.setDate(cur.getDate()+1)}
    if(period==='week')xLabelFor=d=>d.toLocaleDateString(undefined,{weekday:'short'})[0];
    else{const last=days[days.length-1];xLabelFor=d=>(d.getDate()===1||d.getDate()%7===0||d.getDate()===last.getDate())?String(d.getDate()):''}
  }
  // v3.28 — never extend past today. The MA7 stops on the current day; future days are null on both daily AND MA series.
  const todayMid=new Date();todayMid.setHours(0,0,0,0);
  const raw=days.map(d=>d.getTime()>todayMid.getTime()?null:metricValueFor(metric,isoOf(d)));
  const lookback=[];for(let i=6;i>0;i--){const d=new Date(days[0]);d.setDate(d.getDate()-i);lookback.push(metricValueFor(metric,isoOf(d)))}
  const full=[...lookback,...raw];
  const ma7=raw.map((_,i)=>{
    if(days[i].getTime()>todayMid.getTime())return null;  // never compute MA for future dates
    const w=full.slice(i,i+7).filter(v=>v!=null);
    return w.length?w.reduce((a,b)=>a+b,0)/w.length:null;
  });
  const c=def.color||'#1A1F2E';
  const fade=(hex,a)=>{const m=hex.replace('#','');const r=parseInt(m.slice(0,2),16),g=parseInt(m.slice(2,4),16),b=parseInt(m.slice(4,6),16);return `rgba(${r},${g},${b},${a})`};
  const useBar=def.type==='sum';
  const dailyDataset=useBar
    ? {type:'bar',label:'Daily',data:raw,backgroundColor:fade(c,mode==='spark'?0:0.4),borderColor:fade(c,0.4),borderWidth:0,borderRadius:3,barPercentage:0.7,categoryPercentage:0.85,order:2}
    : {type:'line',label:'Daily',data:raw,borderColor:'transparent',backgroundColor:fade(c,0.5),pointRadius:mode==='spark'?0:3,pointBackgroundColor:fade(c,0.5),showLine:false,spanGaps:false,order:2};
  const maDataset={type:'line',label:'7-day avg',data:ma7,borderColor:c,backgroundColor:fade(c,mode==='spark'?0.22:0.12),fill:(!useBar||mode==='spark'),tension:0.35,pointRadius:0,borderWidth:mode==='spark'?1.8:(useBar?2:2.5),spanGaps:true,order:1};
  const datasets=mode==='spark'?[maDataset]:[dailyDataset,maDataset];
  const xConfig=mode==='spark'?{display:false}:{grid:{display:false},ticks:{color:'#7C8497',font:{size:10},autoSkip:false,maxRotation:0}};
  const yConfig=mode==='spark'?{display:false}:{position:'right',grid:{color:'rgba(217,223,230,0.5)',drawTicks:false},ticks:{color:'#7C8497',font:{size:10},maxTicksLimit:5},beginAtZero:useBar};
  const tooltip=mode==='spark'?{enabled:false}:{enabled:true,mode:'index',intersect:false};
  if(canvas._chart){try{canvas._chart.destroy()}catch(_){}}
  canvas._chart=new Chart(canvas.getContext('2d'),{
    data:{labels:days.map(xLabelFor),datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip},scales:{x:xConfig,y:yConfig}}
  });
  return {chart:canvas._chart,raw,ma7,days};
}
// Thin wrapper: compute hero number, defer chart to buildMetricChart.
function drawMetricChart(){
  const canvas=document.getElementById('md-chart');
  if(!canvas)return;
  const metric=state.metric||'weight';
  const def=METRIC_DEFS[metric]||METRIC_DEFS.weight;
  const period=state.metricPeriod||'week';
  const offset=state.metricOffset||0;
  const res=buildMetricChart(canvas,{metric,period,offset,mode:'detail'});
  if(!res){const el=document.getElementById('md-total');if(el)el.textContent='—';return}
  const valid=res.raw.filter(v=>v!=null);
  let hero=null,heroSub=def.unit||'';
  if(valid.length>0){
    if(def.type==='sum'){hero=valid.reduce((s,v)=>s+v,0);heroSub='total '+(def.unit||'')}
    else{hero=valid.reduce((s,v)=>s+v,0)/valid.length;heroSub='avg '+(def.unit||'')}
  }
  const heroEl=document.getElementById('md-total');
  const heroLabelEl=document.getElementById('md-total-label');
  if(heroEl){
    if(hero==null){heroEl.textContent='—';if(heroLabelEl)heroLabelEl.textContent='no data'}
    else{
      const fmt=['weight','waist','hrv','vo2_max'].includes(metric)?hero.toFixed(1):(metric==='distance'?hero.toFixed(2):Math.round(hero).toLocaleString());
      heroEl.textContent=fmt;
      if(heroLabelEl)heroLabelEl.textContent=heroSub;
    }
  }
}

async function findPreviousPhotoPath(side='front'){
  // Side-aware ghost-overlay reference: when taking a Front photo, only look at Front history.
  // When taking a Side photo, only look at Side history. Falls back to legacy entry.photo for
  // Front (since old entries had single photos with no side designation).
  console.log('[ghost] looking for reference photo (side='+side+')');
  const key=side==='side'?'photoSide':'photoFront';
  const draftDataKey=side==='side'?'photoSideDataUrl':'photoFrontDataUrl';
  const draftPathKey=side==='side'?'photoSidePath':'photoFrontPath';
  // Priority 1: just-captured photo in the current draft for THIS side
  if(state.draft.le&&state.draft.le[draftDataKey]){
    console.log('[ghost] using draft '+draftDataKey);
    return{dataUrl:state.draft.le[draftDataKey],date:today(),label:'just taken'};
  }
  // Priority 2: draft path for THIS side (already-uploaded earlier in session)
  if(state.draft.le&&state.draft.le[draftPathKey]){
    return{path:state.draft.le[draftPathKey],date:today(),label:'today'};
  }
  const t=today();
  // Priority 3: today's saved entry photo for THIS side (+ legacy fallback for Front only)
  const todayEntryNow=state.data.entries[t];
  if(todayEntryNow){
    const p=todayEntryNow[key]||(side==='front'?todayEntryNow.photo:null);
    if(p)return{path:p,date:t,label:'today'};
  }
  // Priority 4: most recent prior photo for THIS side (front falls back to legacy `photo`)
  let entries=Object.entries(state.data.entries).filter(([d,e])=>e[key]||(side==='front'&&e.photo)).sort((a,b)=>b[0].localeCompare(a[0]));
  if(entries.length>0){
    const top=entries[0];
    const p=top[1][key]||top[1].photo;
    console.log('[ghost] using most-recent '+side+' photo from',top[0]);
    return{path:p,date:top[0],label:top[0]===t?'today':fmtDate(top[0])};
  }
  // Last-ditch: pull from GitHub and re-check
  console.log('[ghost] no local '+side+' photos, pulling from GitHub…');
  try{if(isConfigured())await pullData()}catch(e){console.warn('pullData failed',e)}
  entries=Object.entries(state.data.entries).filter(([d,e])=>e[key]||(side==='front'&&e.photo)).sort((a,b)=>b[0].localeCompare(a[0]));
  if(entries.length===0){console.log('[ghost] no '+side+' photos found anywhere');return null}
  const top=entries[0];
  const p=top[1][key]||top[1].photo;
  return{path:p,date:top[0],label:top[0]===t?'today':fmtDate(top[0])};
}

  document.body.appendChild(modal);

  const controlsRow=modal.querySelector('#cam-controls-row'),toggleBtn=modal.querySelector('#cam-toggle');

  const startCamera=async()=>{
    cleanup();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      msgText.textContent='Your browser does not support camera access. Use Gallery instead.';
      return false;
    }
    msgText.textContent='Requesting camera access…';

      v.srcObject=stream;
      await v.play().catch(()=>{});
      msgBox.style.display='none';
      statusEl.textContent=overlayUrl?'Ghost overlay ON':'Camera ready';

      const err=e.name||'';
      let msg='Camera failed: '+(e.message||err);
      if(err==='NotAllowedError'||err==='PermissionDeniedError')msg='Camera permission denied. Grant access in browser/app settings, or use Gallery.';
      else if(err==='NotFoundError')msg='No camera found on this device.';

  // Gallery fallback uses file input
  modal.querySelector('#cam-fallback').addEventListener('click',()=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const u=await compressImage(f);cleanup();modal.remove();onCapture(u)}catch(err){toast('Photo error: '+err.message,'error')}});
    inp.click();
  });
  modal.querySelector('#cam-shoot').addEventListener('click',()=>{
    if(!stream){toast('Camera not ready','error');return}
    const c=document.createElement('canvas');
    c.width=v.videoWidth||1080;c.height=v.videoHeight||1920;
    const ctx=c.getContext('2d');
    if(facing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)}
    ctx.drawImage(v,0,0,c.width,c.height);
    const maxDim=1080;
    let w=c.width,hgt=c.height;
    if(w>hgt&&w>maxDim){hgt=Math.round(hgt*maxDim/w);w=maxDim}
    else if(hgt>maxDim){w=Math.round(w*maxDim/hgt);hgt=maxDim}
    const c2=document.createElement('canvas');c2.width=w;c2.height=hgt;
    c2.getContext('2d').drawImage(c,0,0,w,hgt);
    const dataUrl=c2.toDataURL('image/jpeg',0.85);
    cleanup();modal.remove();
    onCapture(dataUrl);
  });
}

function openFoodQuantityModal(f,onPick){
  // Adaptive: if the food's first portion looks unit-based (e.g. "1 egg", "1 paratha"), show
  // a "servings" stepper. Otherwise show a grams input.
  const portions=f.portions||[{n:'100g',g:100}];
  const standard=portions.find(p=>!p.fromPhoto&&p.g!==100)||portions[0];
  const unitMatch=/^[\s]*1\s+/i.test(standard.n||'')||/\((\d+\.?\d*)\s*g\)/i.test(standard.n||'');
  const looksUnitBased=/\b(egg|paratha|roti|slice|piece|cup|katori|glass|bottle|scoop|item)\b/i.test(standard.n||'');
  const useUnits=looksUnitBased;
  const modal=document.createElement('div');modal.className='modal-bg';
  // v3.17 — meta line from foods.json v3 (source/prep are OBJECTS not strings).
  // Falls back gracefully to string shape if a pre-v3 DB is ever loaded.
  const srcText=(f.source && typeof f.source==='object')
    ? `${f.source.type||''}${f.source.confidence?' · '+f.source.confidence+' confidence':''}`
    : (f.source?String(f.source):'');
  const prepText=(f.prep && typeof f.prep==='object')
    ? `${f.prep.state||''}${f.prep.oil_added?' · with oil':''}`
    : (f.prep?String(f.prep):'');
  const meta=[
    f.brand?escapeHtml(f.brand):null,
    srcText?escapeHtml(srcText):null,
    prepText?escapeHtml(prepText):null,
    f.glycemic_index!=null?('GI '+f.glycemic_index):null,
    f.protein_quality_tag?escapeHtml(String(f.protein_quality_tag).replace(/_/g,' ')):null
  ].filter(Boolean).join(' · ');
  modal.innerHTML=`<div class="modal" style="max-width:380px"><div class="modal-handle"></div>
  <h2 style="font-size:18px;font-weight:700;margin-bottom:2px">${escapeHtml(f.name)}</h2>
  <p class="tiny muted" style="margin-bottom:2px">${escapeHtml(standard.n)} = ${standard.g}g · ${Math.round((f.kcal||0)*standard.g/100)} kcal</p>
  ${meta?`<p class="tiny faint" style="margin-bottom:14px">${meta}</p>`:'<div style="height:12px"></div>'}
  ${useUnits?`
    <div class="field"><div class="flabel">Servings (1 × ${escapeHtml(standard.n)})</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="fq-minus" style="width:44px;height:44px;border-radius:12px;background:var(--surface-cream);font-size:20px;font-weight:700">−</button>
      <input type="number" id="fq-count" value="1" step="0.5" min="0.5" style="flex:1;text-align:center;font-size:28px;font-weight:700;padding:8px;border:1px solid var(--border);border-radius:10px">
      <button id="fq-plus" style="width:44px;height:44px;border-radius:12px;background:var(--surface-cream);font-size:20px;font-weight:700">+</button>
    </div></div>
  `:`
    <div class="field"><div class="flabel">Grams</div>
    <input type="number" id="fq-grams" value="${standard.g}" step="1" min="1" style="width:100%;text-align:center;font-size:32px;font-weight:700;padding:14px;border:1px solid var(--border);border-radius:10px" autofocus>
    <div style="display:flex;gap:6px;margin-top:8px">
      ${[50,100,150,200].map(g=>`<button class="fq-preset" data-g="${g}" style="flex:1;padding:8px;border-radius:8px;background:var(--surface-cream);font-size:12px;font-weight:600">${g}g</button>`).join('')}
    </div></div>
  `}
  <div class="card-flat" id="fq-preview" style="padding:12px;text-align:center;margin-top:14px">
    <div class="tiny muted">Total</div>
    <div style="font-weight:700;font-size:18px" id="fq-kcal">— kcal</div>
    <div class="tiny muted" id="fq-prot">— g protein</div>
  </div>
  <div class="btn-row mt-4"><button class="btn btn-secondary" id="fq-cancel">Cancel</button><button class="btn btn-primary" id="fq-add">＋ Log</button></div>
  </div>`;
  modal.addEventListener('click',ev=>{if(ev.target===modal)modal.remove()});
  modal.querySelector('#fq-cancel').addEventListener('click',()=>modal.remove());
  const recompute=()=>{
    let g;
    if(useUnits){
      const c=parseFloat(modal.querySelector('#fq-count').value)||1;
      g=c*standard.g;
    }else{
      g=parseFloat(modal.querySelector('#fq-grams').value)||0;
    }
    const k=Math.round((f.kcal||0)*g/100);
    const p=(f.protein||0)*g/100;
    modal.querySelector('#fq-kcal').textContent=k+' kcal';
    modal.querySelector('#fq-prot').textContent=p.toFixed(1)+' g protein';
  };
  if(useUnits){
    modal.querySelector('#fq-count').addEventListener('input',recompute);
    modal.querySelector('#fq-minus').addEventListener('click',()=>{const i=modal.querySelector('#fq-count');i.value=Math.max(0.5,(parseFloat(i.value)||1)-0.5);recompute()});
    modal.querySelector('#fq-plus').addEventListener('click',()=>{const i=modal.querySelector('#fq-count');i.value=(parseFloat(i.value)||0)+0.5;recompute()});
  }else{
    modal.querySelector('#fq-grams').addEventListener('input',recompute);
    modal.querySelectorAll('.fq-preset').forEach(b=>b.addEventListener('click',()=>{modal.querySelector('#fq-grams').value=b.dataset.g;recompute()}));
  }
  modal.querySelector('#fq-add').addEventListener('click',()=>{
    let g,portionName;
    if(useUnits){
      const c=parseFloat(modal.querySelector('#fq-count').value)||1;
      g=c*standard.g;
      portionName=c===1?standard.n:`${c} × ${standard.n}`;
    }else{
      g=parseFloat(modal.querySelector('#fq-grams').value)||0;
      if(g<=0){toast('Enter grams > 0','error');return}
      portionName=`${g}g (custom)`;
    }
    const entry={foodId:f.id,name:f.name,portionName,grams:g,kcal:Math.round((f.kcal||0)*g/100),protein:+((f.protein||0)*g/100).toFixed(1)};
    ['carbs','fat','fiber','sat_fat','sugar','sodium_mg','potassium_mg','calcium_mg','iron_mg','magnesium_mg','zinc_mg','vit_a_iu','vit_c_mg','vit_d_iu','vit_b12_ug','folate_ug','leucine_g','selenium_ug'].forEach(k=>{if(f[k])entry[k]=Math.round(f[k]*g/100*100)/100});
    onPick(entry);
    modal.remove();
  });
  recompute();
  document.body.appendChild(modal);
}

// =================== HEALTH CONNECT — COMPREHENSIVE SYNC ===================
let healthConnectReady=false;
const HC_PERMS=['READ_STEPS','READ_HEART_RATE','READ_RESTING_HEART_RATE','READ_ACTIVE_CALORIES','READ_TOTAL_CALORIES','READ_DISTANCE','READ_EXERCISE','READ_WEIGHT','READ_BODY_FAT','READ_HEIGHT','READ_FLOORS_CLIMBED','READ_VO2_MAX','READ_SLEEP','WRITE_WEIGHT','WRITE_EXERCISE'];
const HC_DATA_TYPES=['steps','distance','active-calories','total-calories','floors-climbed','water','heart-rate','resting-heart-rate','oxygen-saturation','respiratory-rate','heart-rate-variability','vo2-max','weight','body-fat','height','blood-pressure-systolic','blood-pressure-diastolic','blood-glucose','body-temperature'];

function hcPlugin(){return window.Capacitor?.Plugins?.HealthPlugin||window.Capacitor?.Plugins?.CapacitorHealth||window.Capacitor?.Plugins?.Health||window.Capacitor?.Plugins?.HealthConnect}

// Write-back helpers. Plugin's exact write API varies across versions; we try multiple shapes.
async function writeWeightToHC(kg,dateIso){
  if(!IS_NATIVE)return false;
  if(!healthConnectReady){const ok=await setupHealthConnect();if(!ok)return false}
  const HC=hcPlugin();if(!HC||!kg)return false;
  // Feature-detect — capacitor-health@8.1.2 is read-only. Bail quietly if no write method exists.
  if(!HC.write&&!HC.writeData&&!HC.writeWeight&&!HC.insertWeight){console.info('HC: weight write not supported in this plugin version');return false}
  const ts=new Date(dateIso+'T12:00:00').toISOString();
  // Try the documented patterns in capacitor-health@8.x and fall through.
  const attempts=[
    ()=>HC.write?.({dataType:'weight',value:kg,startDate:ts,endDate:ts}),
    ()=>HC.writeData?.({dataType:'weight',value:kg,startDate:ts,endDate:ts}),
    ()=>HC.writeWeight?.({value:kg,date:ts}),
    ()=>HC.insertWeight?.({weight:kg,timestamp:ts}),
  ];
  for(const fn of attempts){
    try{const r=await fn();if(r!==undefined)return true}catch(e){/* try next */}
  }
  return false;
}
async function writeHydrationToHC(ml,dateIso){
  if(!IS_NATIVE||!ml)return false;
  if(!healthConnectReady){const ok=await setupHealthConnect();if(!ok)return false}
  const HC=hcPlugin();if(!HC)return false;
  if(!HC.write&&!HC.writeData&&!HC.writeHydration){console.info('HC: hydration write not supported');return false}
  const ts=new Date().toISOString();
  const attempts=[
    ()=>HC.write?.({dataType:'water',value:ml,startDate:ts,endDate:ts}),
    ()=>HC.writeData?.({dataType:'water',value:ml,startDate:ts,endDate:ts}),
    ()=>HC.writeHydration?.({volume:ml,date:ts}),
  ];
  for(const fn of attempts){try{const r=await fn();if(r!==undefined)return true}catch(e){}}
  return false;
}
async function setupHealthConnect(){
  if(!IS_NATIVE)return false;
  const HC=hcPlugin();
  if(!HC){console.warn('HC plugin missing');return false}
  try{
    const avail=await(HC.isHealthAvailable?.());
    if(avail&&avail.available===false){console.warn('HC unavailable');return false}
    await(HC.requestHealthPermissions?.({permissions:HC_PERMS}));
    healthConnectReady=true;
    return true;
  }catch(e){console.warn('HC setup',e);return false}
}

async function _hcAgg(HC,startIso,endIso,type){
  try{
    const r=await HC.queryAggregated?.({startDate:startIso,endDate:endIso,dataType:type,bucket:'day'});
    const arr=r?.aggregatedData||[];
    if(arr.length===0)return null;
    // sum across buckets or pick latest if non-summable
    if(['steps','distance','active-calories','total-calories','floors-climbed','water'].includes(type)){
      return arr.reduce((s,x)=>s+(x.value||0),0);
    }
    return arr[arr.length-1]?.value??null;
  }catch(e){return null}
}

async function syncHealthConnect(dateIso){
  if(!IS_NATIVE)return null;
  if(!healthConnectReady){const ok=await setupHealthConnect();if(!ok)return null}
  const HC=hcPlugin();if(!HC)return null;
  const date=dateIso||today();
  const start=new Date(date+'T00:00:00');
  const end=new Date(date+'T23:59:59');
  const startIso=start.toISOString(),endIso=end.toISOString();
  const hc={syncedAt:nowIso(),available:{}};

  // Pull every aggregatable data type
  for(const type of HC_DATA_TYPES){
    const v=await _hcAgg(HC,startIso,endIso,type);
    if(v!=null){hc[type.replace(/-/g,'_')]=v;hc.available[type]=true}
  }
  // Convert distance from meters to km if present
  if(hc.distance!=null)hc.distance_km=Math.round(hc.distance/10)/100;

  // Workouts/exercise sessions
  try{
    const r=await HC.queryWorkouts?.({startDate:startIso,endDate:endIso,includeHeartRate:true,includeRoute:false});
    hc.workouts=(r?.workouts||r?.sessions||[]).map(w=>({
      type:w.workoutType||w.type||w.exerciseType,
      sourceApp:w.sourceAppId||w.sourceName||w.source,
      start:w.startDate||w.startTime,
      end:w.endDate||w.endTime,
      durationSec:w.duration||w.durationSeconds,
      calories:w.calories||w.activeCalories,
      distance_m:w.distance,
      hrAvg:w.heartRateAvg||w.avgHeartRate,
      hrMax:w.heartRateMax||w.maxHeartRate,
      title:w.title||w.name,
    }));
    if(hc.workouts.length)hc.available.workouts=true;
  }catch(e){console.warn('HC workouts',e)}

  // Sleep — prefer the native Sleep bridge (added v4.0) which returns full stage data
  try{
    const sleepP=window.Capacitor?.Plugins?.Sleep;
    const sleepStart=new Date(start.getTime()-30*3600*1000);
    if(sleepP&&typeof sleepP.querySleep==='function'){
      const r=await sleepP.querySleep({startDate:sleepStart.toISOString(),endDate:endIso});
      const sessions=r?.sessions||[];
      if(sessions.length>0){
        const last=sessions[sessions.length-1];
        hc.sleep={
          start:last.startTime,
          end:last.endTime,
          hours:Math.round((last.durationMinutes/60)*10)/10,
          stages:last.stages||null,
        };
        hc.available.sleep=true;
      }
    }else if(typeof HC.querySleep==='function'){
      const r=await HC.querySleep({startDate:sleepStart.toISOString(),endDate:endIso});
      const sessions=r?.sleepData||r?.sleepSessions||r?.sessions||[];
      if(sessions.length>0){
        const last=sessions[sessions.length-1];
        const sd=new Date(last.startDate||last.startTime),ed=new Date(last.endDate||last.endTime);
        hc.sleep={start:sd.toISOString(),end:ed.toISOString(),hours:Math.round((ed-sd)/360000)/10,stages:last.stages||last.sleepStages||null};
        hc.available.sleep=true;
      }
    }else{
      const r=await HC.queryAggregated?.({startDate:startIso,endDate:endIso,dataType:'sleep',bucket:'day'}).catch(()=>null);
      const v=r?.aggregatedData?.[0]?.value;
      if(v){hc.sleep={hours:Math.round((v/3600)*10)/10};hc.available.sleep=true}
    }
  }catch(e){console.warn('HC sleep',e)}

  // HRV — native Sleep bridge exposes queryHrv
  try{
    const sleepP=window.Capacitor?.Plugins?.Sleep;
    if(sleepP&&typeof sleepP.queryHrv==='function'){
      const r=await sleepP.queryHrv({startDate:startIso,endDate:endIso});
      const samples=r?.samples||[];
      if(samples.length){
        const vals=samples.map(s=>s.rmssd_ms).filter(v=>v>0);
        if(vals.length){
          hc.hrv_rmssd_avg=Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
          hc.hrv_samples=vals.length;
          hc.available.hrv=true;
        }
      }
    }
  }catch(e){console.warn('HC hrv',e)}

  // RHR — native Sleep bridge exposes queryRestingHeartRate (override aggregated if available)
  try{
    const sleepP=window.Capacitor?.Plugins?.Sleep;
    if(sleepP&&typeof sleepP.queryRestingHeartRate==='function'){
      const r=await sleepP.queryRestingHeartRate({startDate:startIso,endDate:endIso});
      const vals=(r?.values||[]).map(v=>v.bpm).filter(v=>v>0);
      if(vals.length){
        hc.resting_heart_rate=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
        hc.available['resting-heart-rate']=true;
      }
    }
  }catch(e){console.warn('HC rhr native',e)}

  // HR streams — capacitor-health@8.1.2 doesn't expose a top-level HR query.
  // Heart-rate data comes through queryWorkouts with includeHeartRate:true (above).
  // Aggregate min/avg/max from any workout HR samples we collected.
  try{
    const hrVals=[];
    for(const w of hc.workouts||[]){
      if(w.hrAvg)hrVals.push(w.hrAvg);
      if(w.hrMax)hrVals.push(w.hrMax);
      if(Array.isArray(w.heartRate))for(const sample of w.heartRate){const b=sample.bpm||sample.value;if(b>0)hrVals.push(b)}
    }
    if(hrVals.length){
      hc.hr_min=Math.min(...hrVals);
      hc.hr_max=Math.max(...hrVals);
      hc.hr_avg=Math.round(hrVals.reduce((a,b)=>a+b,0)/hrVals.length);
      hc.hr_samples=hrVals.length;
    }
  }catch(e){}

  // Store in entry + push
  const e=state.data.entries[date]||{};
  e.hc=hc;
  e.hcSyncedAt=nowIso();
  // Note: we intentionally do NOT auto-populate entry.weight from HC.
  // Weight is manual-only — the app remains the source of truth and writes
  // back to HC via writeWeightToHC on save. HC weight is still recorded
  // under entry.hc.weight for reference / future trend cross-checks.
  state.data.entries[date]=e;
  saveLocalData();
  state.lastHcSyncAt=nowIso();
  if(isConfigured()){pushData().catch(err=>console.warn('hc push failed',err))}
  return hc;
}

// Multi-day backfill — useful on first run or after a gap. Syncs N days ending today.
async function syncHealthConnectRange(days=7){
  if(!IS_NATIVE)return {synced:0,failed:0};
  if(!healthConnectReady){const ok=await setupHealthConnect();if(!ok)return {synced:0,failed:0}}
  let synced=0,failed=0;
  for(let i=days-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    try{const r=await syncHealthConnect(iso);if(r)synced++;else failed++}catch(e){failed++}
  }
  return {synced,failed};
}

// Compute today's daytime-sleep window (only meaningful on shift days). Returns
// {startMs, endMs} or null if not a shift day.
function todaySleepWindow(){
  if(!isShiftDay())return null;
  const now=new Date();
  // Shift sleep target: 2:00 PM to 9:30 PM (matches the corrected schedule)
  const start=new Date(now);start.setHours(14,0,0,0);
  const end=new Date(now);end.setHours(21,30,0,0);
  return {startMs:start.getTime(),endMs:end.getTime()};
}

async function setupShiftRescue(){

  try{
    await SR.setSleepWindow({startMs:w.startMs,endMs:w.endMs});
    return true;
  }catch(e){console.warn('setSleepWindow',e);return false}
}

// =================== WORKOUTS ===================
// Additive feature (Phase 1: data layer only, no UI).
// Isolated from state.data — cache lives in its own localStorage key. Nothing here touches
// state.data.entries, log.json, migrateData, pushData/pullData, weight/waist/photos, or HC.
//
// Path split (source-of-truth boundaries):
//   data/workouts/current.json          — ChatGPT-owned current prescription (READ ONLY)
//   data/workouts/manifest.json         — ChatGPT-owned manifest (READ ONLY, later phase)
//   data/workouts/archive/<id>.json     — ChatGPT-owned historical prescriptions (READ ONLY)
//   data/workouts/completions/<id>.json — Living-Life-owned execution records (WRITE in Phase 6)
// Living Life must NEVER write to current.json or archive/. ChatGPT must NEVER write to completions/.

const WORKOUT_CACHE_KEY = 'living-life-workout-cache-v1';
const WORKOUT_SCHEMA_VERSION = 1;

function loadWorkoutCache(){
  try{
    const raw = localStorage.getItem(WORKOUT_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return null;
    return parsed; // {prescription, cachedAt}
  }catch(e){return null}
}
function saveWorkoutCache(prescription){
  try{
    localStorage.setItem(WORKOUT_CACHE_KEY, JSON.stringify({prescription, cachedAt: nowIso()}));
    return true;
  }catch(e){console.warn('workout cache save failed', e); return false}
}

// Lightweight structural validator. Rejects malformed JSON, unsupported schemaVersion, or
// missing required top-level fields. Optional fields (goals, location, notes, etc.) are not
// enforced — the viewer (later phase) is responsible for graceful missing-field handling.
function validateWorkoutPrescription(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, reason:'not an object'};
  if(obj.schemaVersion !== WORKOUT_SCHEMA_VERSION){
    return {ok:false, reason:'unsupported schemaVersion '+obj.schemaVersion+', expected '+WORKOUT_SCHEMA_VERSION};
  }
  if(typeof obj.id !== 'string' || !obj.id) return {ok:false, reason:'missing id'};
  if(typeof obj.title !== 'string' || !obj.title) return {ok:false, reason:'missing title'};
  if(typeof obj.sessionType !== 'string' || !obj.sessionType) return {ok:false, reason:'missing sessionType'};
  return {ok:true};
}

// Hydrate state.workout.prescription from localStorage cache. Safe on cold boot.
// Cache preservation rule (constraint 9): only successful, valid GitHub fetches replace the
// cache. Any error condition (network, auth, 5xx, malformed JSON, invalid schema) leaves cache
// alone. GitHub 404 is reported as 'not-found' but does NOT erase the cache — explicit
// clearing semantics are deferred to a later phase.
function loadWorkoutFromCache(){
  if(!state.workout) state.workout = {prescription:null, active:null, ui:{}};
  const cache = loadWorkoutCache();
  if(cache && cache.prescription){
    state.workout.prescription = cache.prescription;
    return cache.prescription;
  }
  return null;
}

// TODO(follow-up): 404 vs network/error is semantically ambiguous in Phase 1.
// A GitHub 404 could eventually mean 'ChatGPT intentionally removed current.json because
// there is no current workout' — but a network/auth/5xx/malformed error means 'remote state
// unknown, preserve cache'. For now we preserve cache on BOTH conditions to avoid erasing
// a valid cached workout because of a transient failure. The preferred long-term solution
// is an explicit contract, likely via manifest.json (e.g. {"hasCurrentWorkout": false}),
// not by inferring intent from file deletion. Do NOT solve this in Phase 2.
//
// Async fetch of data/workouts/current.json from the currently configured private data repo
// (same PAT and ghGetFile helper used for log.json / photos). Returns a status object:
//   {status:'ok', prescription}       — fetched + validated + cached; state.workout updated
//   {status:'not-found'}              — GitHub 404; cache untouched
//   {status:'invalid', reason}        — schema violation; cache untouched
//   {status:'error', error}           — network/auth/5xx/malformed; cache untouched
//   {status:'not-configured'}         — no GitHub credentials yet; nothing to do
async function fetchWorkoutPrescription(){
  if(!state.workout) state.workout = {prescription:null, active:null, ui:{}};
  if(!isConfigured()) return {status:'not-configured'};
  try{
    const r = await ghGetFile('data/workouts/current.json');
    if(r && r.notFound){
      return {status:'not-found'};
    }
    let parsed;
    try{ parsed = JSON.parse(b64dec(r.content)); }
    catch(e){ return {status:'invalid', reason:'malformed JSON'}; }
    const v = validateWorkoutPrescription(parsed);
    if(!v.ok){
      console.warn('workout prescription invalid:', v.reason);
      return {status:'invalid', reason:v.reason};
    }
    // Successful + valid: authoritative → replace cache and update in-memory state.
    // Correction #1 (Phase 3): if the fetched prescription is different from what's already
    // in memory (by id + createdAt), re-render if the user is on a screen that shows workout
    // data. No-op when same id/createdAt to prevent render loop.
    const prev = state.workout.prescription;
    const isDifferent = !prev || prev.id !== parsed.id || prev.createdAt !== parsed.createdAt;
    saveWorkoutCache(parsed);
    state.workout.prescription = parsed;
    // Correction (Phase 4): if the user is actively performing a workout, do NOT re-render
    // the workout screen — that would rebuild the DOM and erase unsaved input values (e.g.
    // half-typed weight and reps for a set they're about to complete). The new prescription
    // is still cached silently above and will be observed by the next natural render.
    const hasActiveInProgress = state.workout.active && state.workout.active.status === 'in_progress';
    if(isDifferent){
      if(state.screen === 'today'){
        try{ render(); } catch(e){ console.warn('post-fetch render failed', e); }
      } else if(state.screen === 'workout' && !hasActiveInProgress){
        try{ render(); } catch(e){ console.warn('post-fetch render failed', e); }
      }
      // else: silent update; UI stays intact
    }
    return {status:'ok', prescription:parsed, changed:isDifferent};
  }catch(e){
    const msg = (e && e.message) || String(e);
    console.warn('fetchWorkoutPrescription failed:', msg);
    return {status:'error', error:msg};
  }
}

// ---- Phase 2: Today card + read-only workout viewer ----
// No timers, no execution state, no writes to GitHub. Pure display of the cached/fetched
// prescription. Every accessor tolerates optional/missing fields per spec §WORKOUT JSON CONTRACT.

// Today card. Two states in Phase 2: no workout, or assigned. Button label is 'View workout'
// (not 'Start workout') because Phase 2 has no execution-state creation.
function renderWorkoutCard(){
  const p = state.workout && state.workout.prescription;
  const active = state.workout && state.workout.active;
  // Active session takes precedence — may reference a different workoutId than current prescription.
  if(active && active.status === 'in_progress'){
    const ap = active.prescriptionSnapshot;
    const title = (ap && ap.title) || 'In-progress workout';
    return `<div class="gf-card" style="margin-top:18px;background:linear-gradient(135deg,var(--coral-s),#FEF2EC);border:1px solid rgba(237,122,77,0.3)">
      <div style="font-size:11px;font-weight:700;color:var(--coral);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Workout in progress</div>
      <div style="font-weight:700;font-size:16px;line-height:1.2;margin-bottom:2px">${escapeHtml(title)}</div>
      ${_wkActiveSummary(active)}
      <button class="btn btn-primary btn-full" id="t-workout-continue">Continue workout</button>
    </div>`;
  }
  // Rule #15: if the currently assigned prescription's id matches a completed workout in the
  // local cache, show a 'Today's workout' completed state instead of a fresh 'View workout' card.
  // This prevents me from accidentally starting a new active session for a workout I already did.
  const completions = (state.workout && state.workout.completions) || {};
  if(p && completions[p.id] && completions[p.id].record){
    const rec = completions[p.id].record;
    const isCompleted = rec.status === 'completed';
    const rpe = rec.sessionRpe;
    const bits = [];
    if(isCompleted) bits.push('✓ Completed'); else bits.push('↻ Partial');
    if(rec.completedAt) bits.push(fmtDate(rec.completedAt.slice(0,10)));
    if(rpe != null) bits.push('Effort ' + rpe + '/10');
    // Rule #12: small non-dominant sync indicator subtitle.
    const syncState = completions[p.id].syncState || 'pending';
    let syncLine = '';
    if(syncState === 'syncing') syncLine = 'Syncing…';
    else if(syncState === 'pending') syncLine = 'Saved locally · sync pending';
    else if(syncState === 'conflict') syncLine = 'Sync conflict — will resolve later';
    else if(syncState === 'error') syncLine = 'Sync error — will retry';
    // 'synced' shows nothing to avoid clutter on the happy path.
    return `<div class="gf-card" style="margin-top:18px;background:var(--success-s);border:1px solid rgba(77,168,105,0.3)">
      <div style="font-size:11px;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Today's workout</div>
      <div style="font-weight:700;font-size:16px;line-height:1.2;margin-bottom:4px">${escapeHtml(p.title || rec.prescriptionSnapshot?.title || 'Workout')}</div>
      <div class="tiny muted">${escapeHtml(bits.join(' · '))}</div>
      ${syncLine ? `<div class="tiny faint" style="margin-top:4px">${escapeHtml(syncLine)}</div>` : ''}
    </div>`;
  }
  if(!p){
    return `<div class="gf-card" style="margin-top:18px;text-align:center">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Workout</div>
      <div style="font-size:14px;color:var(--muted)">No workout assigned</div>
    </div>`;
  }
  const dur = p.estimatedDurationMin;
  const st  = p.sessionType || 'workout';
  const sched = p.scheduledDate ? ` · ${escapeHtml(fmtDate(p.scheduledDate))}` : '';
  return `<div class="gf-card" style="margin-top:18px">
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Next workout</div>
    <div style="font-weight:700;font-size:16px;line-height:1.2;margin-bottom:2px">${escapeHtml(p.title || 'Untitled')}</div>
    <div class="tiny muted" style="margin-bottom:12px">${escapeHtml(st)}${dur?` · ~${dur} min`:''}${sched}</div>
    <button class="btn btn-primary btn-full" id="t-workout-view">View workout</button>
  </div>`;
}

// Small format helpers
function _wkFmtSec(sec){
  if(sec==null || isNaN(sec)) return '';
  if(sec < 60) return sec + ' sec';
  const m = Math.floor(sec/60), s = sec % 60;
  return s === 0 ? m + ' min' : m + ':' + String(s).padStart(2,'0');
}
function _wkFmtMin(mins){
  if(mins==null || isNaN(mins)) return '';
  return mins + ' min';
}
// Accepts targetRpe (single) OR targetRpeMin/targetRpeMax (range). Returns '' if neither.
function _wkRpeText(item){
  const min = item.targetRpeMin, max = item.targetRpeMax;
  if(min!=null && max!=null) return 'Target RPE ' + min + '-' + max;
  if(item.targetRpe!=null) return 'Target RPE ' + item.targetRpe;
  return '';
}

// Generic activity row — used by warmup/cooldown items AND by simple activity block types
// (walk / treadmill_walk / mobility / recovery). Displays title, duration, RPE, notes.
function _wkActivityRow(item){
  if(!item || typeof item !== 'object') return '';
  const dur = item.durationMin!=null
    ? _wkFmtMin(item.durationMin)
    : (item.durationSec!=null ? _wkFmtSec(item.durationSec) : '');
  const rpe = _wkRpeText(item);
  const notes = item.notes
    ? `<div class="tiny muted" style="margin-top:6px;line-height:1.4">${escapeHtml(item.notes)}</div>`
    : '';
  return `<div class="card-flat" style="padding:12px 14px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <div style="font-weight:700;font-size:14px">${escapeHtml(item.title || item.type || 'Activity')}</div>
      <div class="tiny muted" style="white-space:nowrap">${escapeHtml(dur)}${rpe?' · ' + escapeHtml(rpe):''}</div>
    </div>
    ${notes}
  </div>`;
}
