    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-secondary" id="wds-cancel" style="flex:1">Cancel</button>
      <button class="btn btn-primary" id="wds-save" style="flex:1">Save</button>

function bindWorkoutDetail(){
  document.getElementById('wd-back')?.addEventListener('click', ()=> setScreen('workoutHistory'));
  document.getElementById('wd-edit-session')?.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingCompletion = {mode:'session', target:null, draft:null};
    render();
  });
  const wid = state.workoutHistoryDetail;
  // Session edit form wiring
  document.querySelectorAll('.wds-rpe').forEach(b => b.addEventListener('click', ()=>{
    const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
    ec.draft.sessionRpe = parseInt(b.dataset.v, 10); render();
  }));
  document.querySelectorAll('.wds-energy').forEach(b => b.addEventListener('click', ()=>{
    const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
    ec.draft.energyAfter = parseInt(b.dataset.v, 10); render();
  }));
  document.querySelectorAll('.wds-pain').forEach(b => b.addEventListener('click', ()=>{
    const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
    ec.draft.pain = (b.dataset.v === 'true'); render();
  }));
  document.querySelectorAll('.wds-status').forEach(b => b.addEventListener('click', ()=>{
    const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
    ec.draft.status = b.dataset.v; render();
  }));
  const notesEl = document.getElementById('wds-notes');
  if(notesEl){
    notesEl.addEventListener('input', ()=>{
      const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
      ec.draft.notes = notesEl.value;
    });
  }
  document.getElementById('wds-cancel')?.addEventListener('click', ()=>{
    state.workout.ui.editingCompletion = null; render();
  });
  document.getElementById('wds-save')?.addEventListener('click', ()=>{
    const ec = state.workout.ui.editingCompletion; if(!ec || !ec.draft) return;
    const nEl = document.getElementById('wds-notes'); if(nEl) ec.draft.notes = nEl.value;
    const res = editCompletionSession(wid, ec.draft);
    if(!res.ok){ toast(res.reason || 'Cannot save', 'error'); return; }
    state.workout.ui.editingCompletion = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
    toast('Workout updated', 'success');
  });

  // Strength set edit wiring
  document.querySelectorAll('.wch-set-edit').forEach(b => b.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};

  document.querySelectorAll('.wch-block-edit').forEach(b => b.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingCompletion = {mode:'block', target:{blockId:b.dataset.blockid}};
    render();
  }));
  document.querySelectorAll('.wch-block-cancel').forEach(b => b.addEventListener('click', ()=>{
    state.workout.ui.editingCompletion = null; render();
  }));
  document.querySelectorAll('.wch-block-save').forEach(b => b.addEventListener('click', ()=>{
    const blockId = b.dataset.blockid;
    const minInp = document.querySelector('.wch-block-min[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const secInp = document.querySelector('.wch-block-sec[data-blockid="' + _wkAttrEscape(blockId) + '"]');

    const spdInp = document.querySelector('.wch-block-speed[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const incInp = document.querySelector('.wch-block-incline[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const rpeInp = document.querySelector('.wch-block-rpe[data-blockid="' + _wkAttrEscape(blockId) + '"]');

      if((minInp.value !== '') || (secInp.value !== '')){
        opts.actualDurationSec = m * 60 + s;

      opts.distance = parseFloat(distInp.value);
      opts.distanceUnit = distInp.dataset.unit;
    } else if(distInp){ opts.distance = null; }
    if(paceMinInp || paceSecInp){
      const pm = paceMinInp && paceMinInp.value !== '' ? parseInt(paceMinInp.value,10) : 0;
      const ps = paceSecInp && paceSecInp.value !== '' ? parseInt(paceSecInp.value,10) : 0;
      const hasVal = (paceMinInp && paceMinInp.value !== '') || (paceSecInp && paceSecInp.value !== '');
      if(hasVal){
        const combined = pm * 60 + ps;
        opts.paceSecPerKm = combined > 0 ? combined : null;
        opts.paceSource = combined > 0 ? 'user' : null;
      } else {
        opts.paceSecPerKm = null;
        opts.paceSource = null;
      }
    }
    if(spdInp && spdInp.value !== ''){
      opts.speed = parseFloat(spdInp.value);
      opts.speedUnit = spdInp.dataset.unit;
    } else if(spdInp){ opts.speed = null; }
    if(incInp){
      opts.inclinePercent = incInp.value !== '' ? parseFloat(incInp.value) : null;
    }
    if(rpeInp){
      opts.actualRpe = rpeInp.value !== '' ? parseInt(rpeInp.value,10) : null;
    }
    const res = editCompletionBlock(wid, blockId, opts);
    if(!res.ok){ toast(res.reason || 'Cannot save', 'error'); return; }
    state.workout.ui.editingCompletion = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));

  // Interval segment edit wiring
  document.querySelectorAll('.wch-seg-edit').forEach(b => b.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingCompletion = {mode:'segment', target:{blockId:b.dataset.blockid, segmentIndex:parseInt(b.dataset.segidx,10)}};
    render();
  }));
  document.querySelectorAll('.wch-seg-cancel').forEach(b => b.addEventListener('click', ()=>{
    state.workout.ui.editingCompletion = null; render();
  }));
  // Warmup / cooldown activity edit handlers
  document.querySelectorAll('.wch-act-edit').forEach(b => b.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingCompletion = {mode:'activity', target:{phase:b.dataset.phase, activityId:b.dataset.actid}};
    render();
  }));
  document.querySelectorAll('.wch-act-cancel').forEach(b => b.addEventListener('click', ()=>{
    state.workout.ui.editingCompletion = null; render();
  }));
  document.querySelectorAll('.wch-act-save').forEach(b => b.addEventListener('click', ()=>{
    const phase = b.dataset.phase;
    const actid = b.dataset.actid;
    const q = (cls) => document.querySelector('.' + cls + '[data-phase="' + phase + '"][data-actid="' + _wkAttrEscape(actid) + '"]');
    const minInp = q('wch-act-min');
    const secInp = q('wch-act-sec');
    const distInp = q('wch-act-distance');
    const paceMinInp = q('wch-act-pace-min');
    const paceSecInp = q('wch-act-pace-sec');
    const incInp = q('wch-act-incline');
    const spdInp = q('wch-act-speed');
    const opts = {};
    if(minInp && secInp){
      const m = minInp.value !== '' ? parseInt(minInp.value,10) : 0;
      const s = secInp.value !== '' ? parseInt(secInp.value,10) : 0;
      if((minInp.value !== '') || (secInp.value !== '')){
        opts.actualDurationSec = m * 60 + s;
      }
    }
    if(distInp){
      opts.distance = distInp.value !== '' ? parseFloat(distInp.value) : null;
      if(opts.distance != null) opts.distanceUnit = distInp.dataset.unit;
    }
    if(paceMinInp || paceSecInp){
      const pm = paceMinInp && paceMinInp.value !== '' ? parseInt(paceMinInp.value,10) : 0;
      const ps = paceSecInp && paceSecInp.value !== '' ? parseInt(paceSecInp.value,10) : 0;
      const hasVal = (paceMinInp && paceMinInp.value !== '') || (paceSecInp && paceSecInp.value !== '');
      if(hasVal){
        const combined = pm * 60 + ps;
        opts.paceSecPerKm = combined > 0 ? combined : null;
        opts.paceSource = combined > 0 ? 'user' : null;
      } else {
        opts.paceSecPerKm = null; opts.paceSource = null;
      }
    }
    if(incInp) opts.inclinePercent = incInp.value !== '' ? parseFloat(incInp.value) : null;
    if(spdInp){
      opts.speed = spdInp.value !== '' ? parseFloat(spdInp.value) : null;
      if(opts.speed != null) opts.speedUnit = spdInp.dataset.unit;
    }
    const res = editCompletionActivity(wid, phase, actid, opts);
    if(!res.ok){ toast(res.reason || 'Cannot save activity', 'error'); return; }
    state.workout.ui.editingCompletion = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));

  document.querySelectorAll('.wch-seg-save').forEach(b => b.addEventListener('click', ()=>{
    const blockId = b.dataset.blockid;
    const idx = parseInt(b.dataset.segidx, 10);
    const q = (cls) => document.querySelector('.' + cls + '[data-blockid="' + _wkAttrEscape(blockId) + '"][data-segidx="' + idx + '"]');
    const minInp = q('wch-seg-min');
    const secInp = q('wch-seg-sec');

    const paceSecInp = q('wch-seg-pace-sec');
    const incInp = q('wch-seg-incline');
    const rpeInp = q('wch-seg-rpe');
    const opts = {};
    if(minInp && secInp){
      const m = minInp.value !== '' ? parseInt(minInp.value,10) : 0;
      const s = secInp.value !== '' ? parseInt(secInp.value,10) : 0;
      if((minInp.value !== '') || (secInp.value !== '')){
        opts.actualDurationSec = m * 60 + s;
      }
    }
    if(statSel) opts.status = statSel.value;
    if(distInp){
      if(distInp.value !== ''){
        opts.distance = parseFloat(distInp.value);
        opts.distanceUnit = distInp.dataset.unit;
      } else {
        opts.distance = null;
      }
    }
    if(paceMinInp || paceSecInp){
      const pm = paceMinInp && paceMinInp.value !== '' ? parseInt(paceMinInp.value,10) : 0;
      const ps = paceSecInp && paceSecInp.value !== '' ? parseInt(paceSecInp.value,10) : 0;
      const hasVal = (paceMinInp && paceMinInp.value !== '') || (paceSecInp && paceSecInp.value !== '');
      if(hasVal){
        const combined = pm * 60 + ps;
        opts.paceSecPerKm = combined > 0 ? combined : null;
        opts.paceSource = combined > 0 ? 'user' : null;
      } else {
        opts.paceSecPerKm = null;
        opts.paceSource = null;
      }
    }
    if(incInp){
      opts.inclinePercent = incInp.value !== '' ? parseFloat(incInp.value) : null;
    }
    if(rpeInp) opts.actualRpe = rpeInp.value !== '' ? parseInt(rpeInp.value,10) : null;
    const res = editCompletionSegment(wid, blockId, idx, opts);
    if(!res.ok){ toast(res.reason || 'Cannot save segment', 'error'); return; }
    state.workout.ui.editingCompletion = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));
}

// v3.31 — Android hardware back button + browser popstate. Routes by current screen so user can back out of detail / settings / log entry.
function appBack(){
  if(state.screen==='metricDetail'){state.metric=null;state.metricPeriod=null;state.metricOffset=0;setScreen('progress');return true}
  if(state.screen==='settings'){setScreen('today');return true}
  if(state.screen==='logEntry'){const wasEditing=state.editingDate;state.editingDate=null;state.draft={};setScreen(wasEditing&&wasEditing!==today()?'history':'today');return true}
  if(state.screen==='workoutFinish'){ setScreen('workout'); return true; }
  if(state.screen==='workoutDetail'){ setScreen('workoutHistory'); return true; }
  if(state.screen==='workoutHistory'){ setScreen('workout'); return true; }
  if(state.screen==='workout'){ try{ releaseScreen(); }catch(e){} setScreen('today'); return true; }
  if(state.screen==='history'||state.screen==='progress'){setScreen('today');return true}
  return false; // on today/welcome — let OS exit the app
}
try{
  window.Capacitor?.Plugins?.App?.addListener?.('backButton',()=>{
    if(appBack())return;
    if(window.Capacitor?.Plugins?.App?.exitApp)window.Capacitor.Plugins.App.exitApp();
  });
}catch(e){console.warn('back button hook',e)}
window.addEventListener('popstate',()=>{appBack()});
loadLocal();
if(isConfigured())state.screen='today';else state.screen='welcome';
loadWorkoutFromCache(); // Phase 1: hydrate workout cache before first render (no UI yet)
loadActiveWorkoutFromStorage(); // Phase 3: restore any in-progress session for CONTINUE support
loadCompletionsFromStorage(); // Phase 5: hydrate completed-workout cache into state.workout.completions
repairPendingCompletionQueue(); // Phase 6: rebuild pending map from cache syncState (corr. #2)
render();
loadAllDB().then(()=>{state.todayRec=null;render()});
if(isConfigured()){fetchWorkoutPrescription().catch(e=>console.warn('workout prescription fetch',e))} // Phase 1: async fetch; failure preserves cache
if(isConfigured()){syncPendingCompletions().catch(e=>console.warn('completion sync boot',e))} // Phase 6: async drain of pending completions
if(isConfigured()){backfillCompletionsFromGitHub().catch(e=>console.warn('completion backfill boot',e))} // Phase 7: async backfill of remote-only completions
if(IS_NATIVE){
  setupHealthConnect().then(ok=>{
    if(!ok)return;
    // Decide between single-day and multi-day backfill.
    const last=state.data.entries[today()]?.hcSyncedAt;
    const stale=!last||((Date.now()-new Date(last).getTime())>12*3600*1000);
    const job=stale?syncHealthConnectRange(7):syncHealthConnect();
    Promise.resolve(job).then(r=>{render()});
  });
  // Set the sleep-sovereign gate on the native scheduler so notifications respect daytime sleep
  setupShiftRescue();
}
if(isConfigured())pullData().then(()=>render()).catch(e=>console.warn("boot sync failed",e));
