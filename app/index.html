        : '';
      return `<div class="card-flat" style="padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:700;font-size:15px">${escapeHtml(ex.name || ex.id || 'Exercise')}</div>
        <div style="font-size:13px;color:var(--ink);margin-top:2px">${escapeHtml(setsReps)}</div>
        ${rpeLine}
        ${rest}
        ${wLine}
        ${notes}
      </div>`;
    }).join('')}
    ${block.notes ? `<div class="tiny muted" style="padding:2px 4px;line-height:1.4">${escapeHtml(block.notes)}</div>` : ''}
  </div>`;
}

// Interval run block — rounds x segments, each with activity/duration/RPE/notes. Stop
// conditions surface in a red-tinted callout when present.
function _wkIntervalRunBlock(block){
  const rounds = block.rounds!=null ? block.rounds : '?';
  const segs = Array.isArray(block.segments) ? block.segments : [];
  const stops = Array.isArray(block.stopConditions) ? block.stopConditions : [];
  return `<div style="margin-bottom:14px">
    <h2 class="gf-section" style="margin-top:6px">${escapeHtml(block.title || 'Interval run')}</h2>
    <div class="card-flat" style="padding:12px 14px;margin-bottom:8px">
      <div style="font-weight:700;font-size:14px;margin-bottom:8px">${escapeHtml(String(rounds))} rounds</div>
      ${segs.map(s => {
        const dur = _wkFmtSec(s.durationSec);
        const rpe = _wkRpeText(s);
        const notes = s.notes
          ? `<div class="tiny muted" style="margin-top:2px;line-height:1.4">${escapeHtml(s.notes)}</div>`
          : '';
        return `<div style="padding:8px 0;border-top:1px solid var(--border-l);display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
            <div style="font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.06em">${escapeHtml(s.activity || 'Segment')}</div>
            <div class="tiny muted" style="white-space:nowrap">${escapeHtml(dur)}${rpe?' · ' + escapeHtml(rpe):''}</div>
          </div>
          ${notes}
        </div>`;
      }).join('')}
    </div>
    ${stops.length ? `<details class="card-flat" style="padding:8px 12px;background:#FCE5E5;margin-bottom:8px">
      <summary style="cursor:pointer;font-size:11px;font-weight:700;color:#B03A3A;text-transform:uppercase;letter-spacing:0.06em">Stop conditions (${stops.length})</summary>
      <ul style="margin:6px 0 2px;padding-left:20px;font-size:12px;color:#7A2A2A;line-height:1.5">
        ${stops.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
      </ul>
    </details>` : ''}
    ${block.notes ? `<div class="tiny muted" style="padding:2px 4px;line-height:1.4">${escapeHtml(block.notes)}</div>` : ''}
  </div>`;
}

// Continuous run block — single duration + target RPE. Same renderer used for easy_run.
function _wkContinuousRunBlock(block){
  const dur = block.durationMin!=null
    ? _wkFmtMin(block.durationMin)
    : (block.durationSec!=null ? _wkFmtSec(block.durationSec) : '');
  const rpe = _wkRpeText(block);
  return `<div style="margin-bottom:14px">
    <h2 class="gf-section" style="margin-top:6px">${escapeHtml(block.title || 'Continuous run')}</h2>
    <div class="card-flat" style="padding:14px">
      <div style="font-weight:700;font-size:22px;letter-spacing:-0.01em">${escapeHtml(dur || '—')}</div>
      ${rpe ? `<div class="tiny muted" style="margin-top:2px">${escapeHtml(rpe)}</div>` : ''}
      ${block.notes ? `<div class="tiny muted" style="margin-top:8px;line-height:1.4">${escapeHtml(block.notes)}</div>` : ''}
    </div>
  </div>`;
}

// Simple activity block — walk / treadmill_walk / mobility / recovery. Uses _wkActivityRow.
function _wkSimpleActivityBlock(block){
  return `<div style="margin-bottom:14px">
    <h2 class="gf-section" style="margin-top:6px">${escapeHtml(block.title || block.type || 'Activity')}</h2>
    ${_wkActivityRow(block)}
  </div>`;
}

// Unknown block type — graceful placeholder. Renders regardless of shape; never crashes.
// The rest of the workout continues rendering normally.
function _wkUnknownBlock(block){
  const label = (block && (block.title || block.type)) || 'unknown';
  return `<div style="margin-bottom:14px">
    <div class="card-flat" style="padding:12px 14px;background:var(--sun-s);border:1px dashed var(--sun)">
      <div style="font-weight:700;font-size:13px">Unsupported workout block</div>
      <div class="tiny muted" style="margin-top:4px">${escapeHtml(label)}</div>
      <div class="tiny faint" style="margin-top:6px;line-height:1.4">Update Living Life to support this workout type. Other blocks in this workout still render normally.</div>
    </div>
  </div>`;
}

// Block dispatcher. Routes by block.type. Accepts active-session context so run + strength blocks
// switch to execution renderers when appropriate. Positional index is used to derive a stable
// per-block key when the prescription doesn't provide an id.
function _wkRenderBlock(block, active, blockIndex){
  if(!block || typeof block !== 'object') return '';
  const t = block.type;
  const blockId = _wkBlockKey(block, blockIndex);
  if(t === 'strength') return active ? _wkStrengthBlockExecution(block, active) : _wkStrengthBlock(block);
  if(t === 'interval_run') return active ? _wkIntervalRunExecution(block, active, blockId) : _wkIntervalRunBlock(block);
  if(t === 'continuous_run' || t === 'easy_run') return active ? _wkContinuousRunExecution(block, active, blockId) : _wkContinuousRunBlock(block);
  if(t === 'walk' || t === 'treadmill_walk') return active ? _wkContinuousRunExecution(block, active, blockId) : _wkSimpleActivityBlock(block);
  if(t === 'mobility' || t === 'recovery') return _wkSimpleActivityBlock(block);  // no execution for these in Phase 4
  return _wkUnknownBlock(block);
}

// Full workout viewer screen. Phase 3: renders read-only OR execution mode based on whether
// an active session exists. All fields optional per spec.
function renderWorkout(){
  const active = state.workout && state.workout.active;
  const currentP = state.workout && state.workout.prescription;
  // Active session (if present) dictates the workout we render via its immutable snapshot.
  // Otherwise fall back to the currently-fetched prescription. Prescription is never mutated.
  const p = (active && active.prescriptionSnapshot) || currentP;
  if(!p){
    return `<div class="top-bar"><button class="back-btn" id="wk-back">←</button><div class="title-block"><h1>Workout</h1></div><div style="width:44px"></div></div>
    <div style="padding:24px 20px">
      <div class="card-flat" style="padding:24px;text-align:center">
        <div style="font-size:16px;color:var(--muted);font-weight:600">No workout assigned</div>
        <div class="tiny faint" style="margin-top:6px;line-height:1.5">ChatGPT hasn't written a workout to <code>data/workouts/current.json</code> yet, or the fetch is still in progress.</div>
      </div>
    </div>`;
  }
  const dur = p.estimatedDurationMin;
  const sched = p.scheduledDate;
  const loc = p.location;
  const goals = Array.isArray(p.goals) ? p.goals.filter(Boolean) : [];
  const warmup = Array.isArray(p.warmup) ? p.warmup : [];
  const blocks = Array.isArray(p.blocks) ? p.blocks : [];
  const cooldown = Array.isArray(p.cooldown) ? p.cooldown : [];
  const metaBits = [];
  if(dur) metaBits.push('~' + dur + ' min');
  if(sched) metaBits.push('Scheduled ' + fmtDate(sched));
  if(loc && loc.label) metaBits.push(loc.label);
  return `<div class="top-bar"><button class="back-btn" id="wk-back">←</button><div class="title-block"><h1>Workout</h1></div><div style="width:44px"></div></div>
<div style="padding:0 4px 100px">
  <div style="padding:8px 16px 16px">
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em">${escapeHtml(p.sessionType || 'workout')}</div>
    <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.01em;margin-top:4px;line-height:1.2">${escapeHtml(p.title || 'Untitled')}</h1>
    ${metaBits.length ? `<div class="tiny muted" style="margin-top:6px">${metaBits.map(escapeHtml).join(' · ')}</div>` : ''}
    ${(goals.length || p.progressionReason || p.notes) ? `<details style="margin-top:12px">
      <summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:6px 0">Details</summary>
      <div style="padding:6px 0 0">
        ${goals.length ? `<div style="margin-top:8px">
          <div class="tiny faint" style="text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin-bottom:4px">Goals</div>
          <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--ink);line-height:1.5">
            ${goals.map(g => `<li>${escapeHtml(g)}</li>`).join('')}
          </ul>
        </div>` : ''}
        ${p.progressionReason ? `<div style="margin-top:10px;padding:10px 12px;background:var(--surface-cream);border-radius:10px">
          <div class="tiny faint" style="text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin-bottom:4px">Why this workout</div>
          <div style="font-size:13px;line-height:1.5">${escapeHtml(p.progressionReason)}</div>
        </div>` : ''}
        ${p.notes ? `<div style="margin-top:10px;padding:10px 12px;background:var(--surface-sky);border-radius:10px">
          <div class="tiny faint" style="text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin-bottom:4px">Notes</div>
          <div style="font-size:13px;line-height:1.5">${escapeHtml(p.notes)}</div>
        </div>` : ''}
      </div>
    </details>` : ''}
  </div>
  ${warmup.length ? `<div style="padding:0 16px">
    <h2 class="gf-section" style="margin-top:6px">Warmup</h2>
    ${warmup.map((it, i) => _wkActivityRowExec(it, 'warmup', i)).join('')}
  </div>` : ''}
  ${blocks.length ? `<div style="padding:0 16px">
    ${blocks.map((b, i) => _wkRenderBlock(b, active, i)).join('')}
  </div>` : ''}
  ${cooldown.length ? `<div style="padding:0 16px">
    <h2 class="gf-section" style="margin-top:6px">Cooldown</h2>
    ${cooldown.map((it, i) => _wkActivityRowExec(it, 'cooldown', i)).join('')}
  </div>` : ''}
  ${active
    ? `<div style="padding:20px 16px 0"><button class="btn btn-primary btn-full" id="wk-finish-btn">Finish workout</button><div class="tiny faint text-center" style="line-height:1.5;margin-top:8px">Progress is saved locally. GitHub upload comes in a later phase.</div></div>`
    : `<div style="padding:20px 16px 0"><button class="btn btn-primary btn-full" id="wk-start">Start workout</button><div class="tiny faint text-center" style="margin-top:8px;line-height:1.5">Tap to begin tracking sets. The prescription is not modified.</div></div>`}
  <div style="padding:12px 16px 0">
    <button class="btn btn-secondary btn-full" id="wk-history">View workout history</button>
  </div>
</div>`;
}

function bindWorkout(){
  // Back — never discards active state (persists in localStorage). Releases wake lock (#7).
  document.getElementById('wk-back')?.addEventListener('click', ()=>{ try{ releaseScreen(); }catch(e){} setScreen('today'); });
  document.getElementById('wk-history')?.addEventListener('click', ()=>{ setScreen('workoutHistory'); });
  // Finish workout button (only present when an active session exists).
  document.getElementById('wk-finish-btn')?.addEventListener('click', ()=>{
    setScreen('workoutFinish');
  });
  // Start workout button (only present when no active session).
  document.getElementById('wk-start')?.addEventListener('click', ()=>{
    const active = state.workout && state.workout.active;
    if(active && active.status === 'in_progress') return; // guard: already active
    const p = state.workout && state.workout.prescription;
    if(!p) return;
    const res = startWorkout(p);
    if(!res || !res.ok){
      toast((res && res.reason) || 'Cannot start workout', 'error');
      return;
    }
    render();
  });
  // Skip-set: mark set skipped (no rest timer).
  document.querySelectorAll('.wk-skip-set').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    const res = skipSet(exId, setN);
    if(!res.ok){ toast(res.reason || 'Cannot skip set', 'error'); return; }
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  // Skip exercise: mark all remaining sets as skipped.
  document.querySelectorAll('.wk-skip-exercise').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const total = parseInt(b.dataset.total, 10);
    if(!confirm('Skip remaining sets for this exercise?')) return;
    const res = skipExercise(exId, total);
    if(!res.ok){ toast(res.reason || 'Cannot skip exercise', 'error'); return; }
    render();
    try{ nativeHaptic('medium'); }catch(e){}
  }));

  // Complete-set buttons.
  document.querySelectorAll('.wk-complete').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    const restSec = parseInt(b.dataset.restsec, 10) || 0;
    const weightUnit = b.dataset.weightunit || null;
    const row = b.closest('.wk-set-row');
    if(!row) return;
    const wInput = row.querySelector('.wk-set-weight');
    const rInput = row.querySelector('.wk-set-reps');
    const weightVal = wInput ? wInput.value : '';
    const repsVal = rInput ? rInput.value : '';
    const weight = weightVal === '' ? null : parseFloat(weightVal);
    const reps = repsVal === '' ? null : parseInt(repsVal, 10);
    const upd = updateSet(exId, setN, {weight, weightUnit, reps, restSec});
    if(!upd.ok){
      toast(upd.reason || 'Cannot complete set', 'error');
      return;
    }
    render();                 // rebuild with the new set state (timer state survives)
    _wkEnsureTickLoop();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  // Rest-timer +30 seconds.
  document.querySelectorAll('.wk-add30').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    _wkAddRest(exId, setN, 30);
    _wkEnsureTickLoop();
  }));
  document.querySelectorAll('.wk-rest-minus, .wk-rest-plus').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    const delta = parseInt(b.dataset.delta, 10);
    if(!isFinite(delta)) return;
    _wkAdjustRest(exId, setN, delta);
    _wkEnsureTickLoop();
    render();
  }));
  // Rest-timer skip.
  document.querySelectorAll('.wk-skip').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    _wkSkipRest(exId, setN);
    const row = b.closest('.wk-rest-row');
    if(row) row.style.display = 'none';
  }));
  // Correction #12 wiring — strength set editing.
  document.querySelectorAll('.wk-set-edit-trigger').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingSet = {exId, setN};
    state.workout.ui.editingBlock = null;
    render();
  }));
  document.querySelectorAll('.wk-set-edit-cancel').forEach(b => b.addEventListener('click', ()=>{
    if(state.workout.ui) state.workout.ui.editingSet = null;
    render();
  }));
  document.querySelectorAll('.wk-set-edit-save').forEach(b => b.addEventListener('click', ()=>{
    const exId = b.dataset.exid;
    const setN = parseInt(b.dataset.setn, 10);
    const weightUnit = b.dataset.weightunit || null;
    const wInp = document.querySelector('.wk-set-edit-weight[data-exid="' + _wkAttrEscape(exId) + '"][data-setn="' + setN + '"]');
    const rInp = document.querySelector('.wk-set-edit-reps[data-exid="' + _wkAttrEscape(exId) + '"][data-setn="' + setN + '"]');
    const wVal = (wInp && wInp.value !== '') ? parseFloat(wInp.value) : null;
    const rVal = (rInp && rInp.value !== '') ? parseInt(rInp.value, 10) : null;
    const res = editSet(exId, setN, {weight: wVal, weightUnit, reps: rVal});
    if(!res.ok){ toast(res.reason || 'Cannot save set', 'error'); return; }
    if(state.workout.ui) state.workout.ui.editingSet = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));

  // Correction #12 wiring — running-block actuals editing.
  document.querySelectorAll('.wk-block-edit-trigger').forEach(b => b.addEventListener('click', ()=>{
    if(!state.workout.ui) state.workout.ui = {};
    state.workout.ui.editingBlock = b.dataset.blockid;
    state.workout.ui.editingSet = null;
    render();
  }));
  document.querySelectorAll('.wk-block-edit-cancel').forEach(b => b.addEventListener('click', ()=>{
    if(state.workout.ui) state.workout.ui.editingBlock = null;
    render();
  }));
  document.querySelectorAll('.wk-block-edit-save').forEach(b => b.addEventListener('click', ()=>{
    const blockId = b.dataset.blockid;
    const minInp = document.querySelector('.wk-edit-dur-min[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const secInp = document.querySelector('.wk-edit-dur-sec[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const distInp = document.querySelector('.wk-edit-distance[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const paceMinInp = document.querySelector('.wk-edit-pace-min[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const paceSecInp = document.querySelector('.wk-edit-pace-sec[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const incInp = document.querySelector('.wk-edit-incline[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const speedInp = document.querySelector('.wk-edit-speed[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const rpeInp = document.querySelector('.wk-edit-rpe[data-blockid="' + _wkAttrEscape(blockId) + '"]');
    const parseNum = (inp) => (!inp || inp.value === '') ? null : parseFloat(inp.value);
    const parseInt10 = (inp) => (!inp || inp.value === '') ? null : parseInt(inp.value, 10);
    // Duration: min + sec combined
    const mVal = parseInt10(minInp);
    const sVal = parseInt10(secInp);
    let actualDurationSec = undefined;
    if(mVal != null || sVal != null){
      actualDurationSec = (Math.max(0, mVal || 0) * 60) + Math.max(0, sVal || 0);
    }
    // Pace: min + sec (per km). If either has a value, we treat as user-entered.
    const pmVal = parseInt10(paceMinInp);
    const psVal = parseInt10(paceSecInp);
    let paceSecPerKm = undefined;
    if(pmVal != null || psVal != null){
      const combined = (Math.max(0, pmVal || 0) * 60) + Math.max(0, psVal || 0);
      paceSecPerKm = combined > 0 ? combined : null;
    }
    const distVal = parseNum(distInp);
    const distUnit = distInp ? distInp.dataset.unit : null;
    const speedVal = parseNum(speedInp);
    const speedUnit = speedInp ? speedInp.dataset.unit : null;
    const incVal = parseNum(incInp);
    const rpeVal = parseInt10(rpeInp);
    const payload = {};
    if(actualDurationSec !== undefined) payload.actualDurationSec = actualDurationSec;
    if(distInp) { payload.distance = distVal; payload.distanceUnit = distVal != null ? distUnit : null; }
    if(paceSecPerKm !== undefined){
      payload.paceSecPerKm = paceSecPerKm;
      payload.paceSource = paceSecPerKm != null ? 'user' : null;
    }
    if(incInp)  { payload.inclinePercent = incVal; }
    if(speedInp){ payload.speed = speedVal; payload.speedUnit = speedVal != null ? speedUnit : null; }
    if(rpeInp)  { payload.actualRpe = rpeVal; }
    const res = editBlockActuals(blockId, payload);
    if(!res.ok){ toast(res.reason || 'Cannot save actuals', 'error'); return; }
    if(state.workout.ui) state.workout.ui.editingBlock = null;
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));

  // Phase 4 — running blocks: start / pause / resume / skip segment / finish early / distance.
  document.querySelectorAll('.wk-block-start').forEach(b => b.addEventListener('click', ()=>{
    const blockId = b.dataset.blockid;
    _wkStartRunBlock(blockId);
    render();
    _wkEnsureTickLoop();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  document.querySelectorAll('.wk-block-pause').forEach(b => b.addEventListener('click', ()=>{
    _wkPauseRunBlock(b.dataset.blockid);
    render();
  }));
  document.querySelectorAll('.wk-block-resume').forEach(b => b.addEventListener('click', ()=>{
    _wkResumeRunBlock(b.dataset.blockid);
    render();
    _wkEnsureTickLoop();
  }));
  document.querySelectorAll('.wk-block-skip').forEach(b => b.addEventListener('click', ()=>{
    _wkSkipSegment(b.dataset.blockid);
    render();
    _wkEnsureTickLoop();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  document.querySelectorAll('.wk-block-finish').forEach(b => b.addEventListener('click', ()=>{
    _wkFinishContinuousUser(b.dataset.blockid);
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  // Warmup / cooldown activity controls
  document.querySelectorAll('.wk-act-start').forEach(b => b.addEventListener('click', ()=>{
    _wkStartActivity(b.dataset.phase, b.dataset.actid);
    render();
    _wkEnsureTickLoop();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  document.querySelectorAll('.wk-act-pause').forEach(b => b.addEventListener('click', ()=>{
    _wkPauseActivity(b.dataset.phase, b.dataset.actid);
    render();
  }));
  document.querySelectorAll('.wk-act-resume').forEach(b => b.addEventListener('click', ()=>{
    _wkResumeActivity(b.dataset.phase, b.dataset.actid);
    render();
    _wkEnsureTickLoop();
  }));
  document.querySelectorAll('.wk-act-finish').forEach(b => b.addEventListener('click', ()=>{
    _wkFinishActivity(b.dataset.phase, b.dataset.actid, true);
    render();
    try{ nativeHaptic('light'); }catch(e){}
  }));
  document.querySelectorAll('.wk-block-distance').forEach(inp => inp.addEventListener('change', ()=>{
    const res = _wkUpdateDistance(inp.dataset.blockid, inp.value);
    if(res && !res.ok){
      toast(res.reason || 'Invalid distance', 'error');
      // revert input to the persisted value for clarity
      const active = state.workout && state.workout.active;
      const br = active ? _getBlockResult(active, inp.dataset.blockid) : null;
      inp.value = (br && br.distance != null) ? String(br.distance) : '';
    }
  }));
  // If an active session exists, ensure the shared tick loop is running + hold wake lock.
  if(state.workout && state.workout.active){
    _wkEnsureTickLoop();
    if(!wakeLock){ try{ keepScreenOn(); }catch(e){} }
  }
}

// ---- Phase 3: active workout state (session creation, strength set execution, rest timer) ----
// NOT in this phase: running block timers, workout completion, GitHub upload, Health Connect writes.

const WORKOUT_ACTIVE_KEY = 'living-life-active-workout-v1';

function loadActiveWorkout(){
  try{
    const raw = localStorage.getItem(WORKOUT_ACTIVE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return null;
    return parsed;
  }catch(e){ return null }
}
function saveActiveWorkout(active){
  try{ localStorage.setItem(WORKOUT_ACTIVE_KEY, JSON.stringify(active)); return true }
  catch(e){ console.warn('active workout save failed', e); return false }
}
function clearActiveWorkout(){
  try{ localStorage.removeItem(WORKOUT_ACTIVE_KEY); return true }
  catch(e){ return false }
}
// Hydrate state.workout.active from localStorage. Safe on cold boot.
function loadActiveWorkoutFromStorage(){
  if(!state.workout) state.workout = {prescription:null, active:null, ui:{}};
  const raw = loadActiveWorkout();
  if(!raw) return null;
  // Correction #5: validate structure defensively. Malformed data is IGNORED (state.workout.active
  // stays null) but the raw localStorage value is NOT deleted — preserves recoverability if a later
  // manual fix is warranted.
  const v = _wkValidateActiveWorkout(raw);
  if(!v.ok){
    console.warn('active workout in localStorage failed validation:', v.reason, '(ignored, not deleted)');
    return null;
  }
  // Correction #4: on load, silently null out any rest-timer restEndsAt that has already passed.
  // Prevents a stale beep/haptic for a rest period that ended hours ago. Also silently forwards any
  // running-block segmentEndsAt that expired while offline — using the auto-advance logic without
  // audio cues. Live cues are reserved for events that happen during a live workout session.
  let dirty = false;
  const now = Date.now();
  if(Array.isArray(raw.exerciseResults)){
    for(const er of raw.exerciseResults){
      for(const set of (er.sets || [])){
        if(set.restEndsAt && set.restEndsAt <= now){ set.restEndsAt = null; dirty = true; }
      }
    }
  }
  const _actLoadArrs = [raw.warmupResults, raw.cooldownResults];
  for(const arr of _actLoadArrs){
    if(!Array.isArray(arr)) continue;
    for(const ar of arr){
      if(ar.status !== 'in_progress') continue;
      if(ar.isPaused) continue;
      if(ar.segmentEndsAt && ar.segmentEndsAt <= now){
        // Silent natural expiry — credit plannedDurationSec, mark timer_expired_offline.
        let activeMs = ar.activeElapsedMs || 0;
        if(typeof ar.segmentStartedAtMs === 'number'){
          activeMs += Math.max(0, ar.segmentEndsAt - ar.segmentStartedAtMs);
        }
        ar.actualDurationSec = ar.plannedDurationSec != null ? ar.plannedDurationSec : Math.max(0, Math.round(activeMs / 1000));
        ar.actualDurationSource = 'timer';
        ar.completionSource = 'timer_expired_offline';
        ar.status = 'completed';
        ar.activeElapsedMs = activeMs;
        ar.segmentStartedAtMs = null;
        ar.endedAt = new Date(ar.segmentEndsAt).toISOString();
        ar.segmentEndsAt = null;
        dirty = true;
      }
    }
  }
  if(Array.isArray(raw.blockResults)){
    for(const br of raw.blockResults){
      if(br.status !== 'in_progress') continue;
      if(br.isPaused) continue;  // paused blocks retain their remainingMs — nothing to normalize
      if(br.segmentEndsAt && br.segmentEndsAt <= now){
        const block = _wkFindBlockByKey(raw, br.blockId);
        if(block){
          if(br.type === 'interval_run'){
            _wkAdvanceIntervalSilent(raw, br, block, now);
          } else {
            _wkCompleteContinuousSilent(raw, br, now);
          }
        } else {
          br.status = 'stopped_early';
          br.endedAt = nowIso();
          br.segmentEndsAt = null;
        }
        dirty = true;
      }
    }
  }
  if(dirty) saveActiveWorkout(raw);
  state.workout.active = raw;
  return raw;
}

// Create a new active session from a prescription and persist immediately. The prescription is
// deep-snapshotted into the session so execution rendering survives a later current.json swap
// or offline resume (spec §ACTIVE WORKOUT RESUME). We NEVER mutate the source prescription.
// Correction 1 (Phase 6): refuse to start a workout whose id already has a completion record.
// This guards against manual navigation, stale routes, or direct callers bypassing the UI.
// A deliberate future "Repeat workout" flow would need a distinct execution identity.
function startWorkout(prescription){
  if(!prescription || typeof prescription !== 'object' || !prescription.id){
    return {ok:false, reason:'invalid prescription'};
  }
  const completions = (state.workout && state.workout.completions) || {};
  if(completions[prescription.id] && completions[prescription.id].record){
    return {ok:false, reason:'This workout has already been completed.', completed:true};
  }
  const active = {
    schemaVersion: WORKOUT_SCHEMA_VERSION,
    workoutId: prescription.id,
    startedAt: nowIso(),
    status: 'in_progress',
    prescriptionSnapshot: JSON.parse(JSON.stringify(prescription)),
    exerciseResults: [],
    blockResults: [],
    warmupResults: [],
    cooldownResults: []
  };
  if(!state.workout) state.workout = {prescription:null, active:null, ui:{}};
  state.workout.active = active;
  saveActiveWorkout(active);
  return {ok:true, active:active};
}

// Find or create the results entry for one exercise inside the active session.
function _getOrCreateExResult(active, exerciseId){
  if(!Array.isArray(active.exerciseResults)) active.exerciseResults = [];
  let er = active.exerciseResults.find(x => x.exerciseId === exerciseId);
  if(!er){ er = {exerciseId, sets: []}; active.exerciseResults.push(er); }
  return er;
}

// Persist one completed set. Creates or replaces the set with matching setNumber. Starts the
// rest timer immediately by writing restEndsAt = Date.now() + restSec*1000.
function updateSet(exerciseId, setNumber, opts){
  const active = state.workout && state.workout.active;
  if(!active) return {ok:false, reason:'no active session'};
  const {weight, weightUnit, reps, restSec} = opts || {};
  // Correction #2: reps must be a finite integer >= 1. Reject blank / NaN / Infinity / negative / decimal.
  if(reps == null || typeof reps !== 'number' || !isFinite(reps) || !Number.isInteger(reps) || reps < 1){
    return {ok:false, reason:'Enter reps (whole number, at least 1)'};
  }
  // Correction #2: weight may be null (bodyweight / not applicable) OR finite non-negative number.
  let cleanWeight = null;
  let cleanUnit = null;
  if(weight != null){
    if(typeof weight !== 'number' || !isFinite(weight) || weight < 0){
      return {ok:false, reason:'Weight must be a non-negative number'};
    }
    cleanWeight = weight;
    // Correction #3: when a weight is entered, an unambiguous unit must be stored. Caller is
    // expected to have resolved via _wkResolveWeightUnit before invoking.
    cleanUnit = (typeof weightUnit === 'string' && weightUnit.length > 0) ? weightUnit : null;
    if(cleanUnit == null){
      return {ok:false, reason:'Weight unit could not be resolved'};
    }
  }
  const er = _getOrCreateExResult(active, exerciseId);
  // Close out the previous set's rest window if it's still open.
  const prev = er.sets.find(s => s.completed && s.actualRestSec == null && s.restStartedAtMs != null);
  if(prev){
    prev.actualRestSec = Math.max(0, Math.round((Date.now() - prev.restStartedAtMs) / 1000));
  }
  er.sets = er.sets.filter(s => s.setNumber !== setNumber);
  const rs = (typeof restSec === 'number' && restSec > 0) ? restSec : null;
  er.sets.push({
    setNumber,
    weight: cleanWeight,
    weightUnit: cleanUnit,
    reps: reps,
    completed: true,
    completedAt: nowIso(),
    restSec: rs,                                         // prescribed rest (immutable snapshot)
    restEndsAt: rs ? Date.now() + rs * 1000 : null,
    restStartedAtMs: rs ? Date.now() : null,             // for computing actualRestSec
    actualRestSec: null                                  // set on next-set-complete or skip
  });
  er.sets.sort((a, b) => a.setNumber - b.setNumber);
  saveActiveWorkout(active);
  return {ok:true};
}

// Mark a set as skipped. Records weight/reps as null, status 'skipped'. Does NOT start a rest timer.
function skipSet(exerciseId, setNumber){
  const active = state.workout && state.workout.active;
  if(!active) return {ok:false, reason:'no active session'};
  const er = _getOrCreateExResult(active, exerciseId);
  er.sets = er.sets.filter(s => s.setNumber !== setNumber);
  er.sets.push({
    setNumber,
    weight: null,
    weightUnit: null,
    reps: null,
    completed: false,
    status: 'skipped',
    completedAt: nowIso(),
    restSec: null,
    restEndsAt: null
  });
  er.sets.sort((a, b) => a.setNumber - b.setNumber);
  saveActiveWorkout(active);
  return {ok:true};
}

// Mark all remaining uncompleted/unskipped sets in an exercise as skipped.
// Preserves already-completed sets.
function skipExercise(exerciseId, totalSets){
  const active = state.workout && state.workout.active;
  if(!active) return {ok:false, reason:'no active session'};
  const er = _getOrCreateExResult(active, exerciseId);
  const existing = new Set((er.sets || []).map(s => s.setNumber));
  for(let n = 1; n <= totalSets; n++){
    if(existing.has(n)) continue;
    er.sets.push({
      setNumber: n,
      weight: null,
      weightUnit: null,
      reps: null,
      completed: false,
      status: 'skipped',
      completedAt: nowIso(),
      restSec: null,
      restEndsAt: null
    });
  }
  er.sets.sort((a, b) => a.setNumber - b.setNumber);
  saveActiveWorkout(active);
  return {ok:true};
}

// Adjust a set's rest timer by delta seconds (positive or negative). Clamps at 0.
function _wkAdjustRest(exerciseId, setNumber, deltaSec){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const er = _getOrCreateExResult(active, exerciseId);
  const set = er.sets.find(s => s.setNumber === setNumber);
  if(!set || !set.restEndsAt) return;
  const now = Date.now();
  const newEnds = set.restEndsAt + deltaSec * 1000;
  set.restEndsAt = newEnds > now ? newEnds : now; // never negative-remaining
  saveActiveWorkout(active);
}

function _wkAddRest(exerciseId, setNumber, secondsToAdd){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const er = _getOrCreateExResult(active, exerciseId);
  const set = er.sets.find(s => s.setNumber === setNumber);
  if(set && set.restEndsAt){
    set.restEndsAt += (secondsToAdd || 0) * 1000;
    saveActiveWorkout(active);
  }
}
function _wkSkipRest(exerciseId, setNumber){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const er = _getOrCreateExResult(active, exerciseId);
  const set = er.sets.find(s => s.setNumber === setNumber);
  if(set){
    // Capture actual rest at skip time.
    if(set.restStartedAtMs != null && set.actualRestSec == null){
      set.actualRestSec = Math.max(0, Math.round((Date.now() - set.restStartedAtMs) / 1000));
    }
    set.restEndsAt = null;
    saveActiveWorkout(active);
  }
}

// Sanitize an attribute value for use in a querySelector. Uses CSS.escape when available.
function _wkAttrEscape(s){
  if(typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(String(s));
  return String(s).replace(/["\\]/g, '');
}

// Single shared tick loop. Refreshes every visible rest-timer DOM element every 250 ms.
// Timer state lives on active.exerciseResults[].sets[].restEndsAt so it survives re-renders,
// navigation, app suspend, and full reload.
let _wkTickInterval = null;
function _wkTick(){
  const active = state.workout && state.workout.active;
  if(!active){
    if(_wkTickInterval){ clearInterval(_wkTickInterval); _wkTickInterval = null; }
    return;
  }
  const now = Date.now();
  let anyRunning = false;
  let dirty = false;
  let structuralChange = false;  // set true when a running block advances a segment/round or completes

  // Rest timers (Phase 3).
  if(Array.isArray(active.exerciseResults)){
    for(const er of active.exerciseResults){
      for(const set of (er.sets || [])){
        if(set.completed && set.restEndsAt){
          const remaining = set.restEndsAt - now;
          const sel = '.wk-timer-display[data-exid="' + _wkAttrEscape(er.exerciseId) + '"][data-setn="' + set.setNumber + '"]';
          const disp = document.querySelector(sel);
          if(remaining > 0){
            anyRunning = true;
            if(disp) disp.textContent = _wkFmtSec(Math.ceil(remaining / 1000));
          } else {
            // Rest expired naturally — treat actualRestSec as the prescribed rest.
            if(set.restStartedAtMs != null && set.actualRestSec == null && set.restSec != null){
              set.actualRestSec = set.restSec;
            }
            set.restEndsAt = null;
            dirty = true;
            const rowSel = '.wk-rest-row[data-exid="' + _wkAttrEscape(er.exerciseId) + '"][data-setn="' + set.setNumber + '"]';
            const row = document.querySelector(rowSel);
            if(row) row.style.display = 'none';
            try{ nativeHaptic('light'); }catch(e){}
            try{ beep(800, 200); }catch(e){}
          }
        }
      }
    }
  }

  // Warmup / cooldown activity timers — natural expiry credits plannedDurationSec.
  const _actLoops = [
    {arr: active.warmupResults, phase: 'warmup'},
    {arr: active.cooldownResults, phase: 'cooldown'}
  ];
  for(const {arr, phase} of _actLoops){
    if(!Array.isArray(arr)) continue;
    for(const ar of arr){
      if(ar.status !== 'in_progress') continue;
      if(ar.isPaused) continue;
      if(!ar.segmentEndsAt) continue;
      const remaining = ar.segmentEndsAt - now;
      const disp = document.querySelector('.wk-act-timer[data-actid="' + _wkAttrEscape(ar.activityId) + '"]');
      if(remaining > 0){
        anyRunning = true;
        if(disp) disp.textContent = _wkFmtSec(Math.ceil(remaining / 1000));
      } else {
        _wkFinishActivity(phase, ar.activityId, false);
        try{ nativeHaptic('medium'); }catch(e){}
        try{ beep(1000, 220); }catch(e){}
        dirty = true;
        structuralChange = true;
      }
    }
  }
  // Running block timers (Phase 4). Auto-advance interval segments/rounds and auto-complete
  // continuous blocks when the current segment's timestamp elapses.
  if(Array.isArray(active.blockResults)){
    for(const br of active.blockResults){
      if(br.status !== 'in_progress') continue;
      if(br.isPaused) continue;
      if(!br.segmentEndsAt) continue;
      const remaining = br.segmentEndsAt - now;
      const disp = document.querySelector('.wk-block-timer[data-blockid="' + _wkAttrEscape(br.blockId) + '"]');
      if(remaining > 0){
        anyRunning = true;
        if(disp) disp.textContent = _wkFmtSec(Math.ceil(remaining / 1000));
      } else {
        // Segment expired live — advance with audio cue.
        const block = _wkFindBlockByKey(active, br.blockId);
        if(block){
          if(br.type === 'interval_run'){
            _wkAdvanceIntervalLive(active, br, block, now);
          } else {
            _wkCompleteContinuousLive(active, br, now);
          }
        } else {
          br.status = 'stopped_early';
          br.endedAt = nowIso();
          br.segmentEndsAt = null;
        }
        dirty = true;
        structuralChange = true;
      }
    }
  }

  if(dirty) saveActiveWorkout(active);
  // Only re-render when structure changed (segment/round/block boundary) AND user is watching.
  if(structuralChange && state.screen === 'workout'){
    try{ render(); }catch(e){ console.warn('running-timer render failed', e); }
  }
  if(!anyRunning && _wkTickInterval){ clearInterval(_wkTickInterval); _wkTickInterval = null; }
}
function _wkEnsureTickLoop(){
  if(!_wkTickInterval) _wkTickInterval = setInterval(_wkTick, 250);
}

// Compact live summary shown on the Today card when a workout is in progress.
function _wkActiveSummary(active){
  const ap = active.prescriptionSnapshot;
  if(!ap) return '';
  let total = 0, done = 0;
  for(const block of (ap.blocks || [])){
    if(block.type === 'strength'){
      for(const ex of (block.exercises || [])) total += (ex.sets || 0);
    }
  }
  for(const er of (active.exerciseResults || [])){
    done += (er.sets || []).filter(s => s.completed).length;
  }
  const elapsedMs = active.startedAt ? (Date.now() - new Date(active.startedAt).getTime()) : 0;
  const elapsedMin = elapsedMs > 0 ? Math.floor(elapsedMs / 60000) : null;
  const bits = [];
  if(elapsedMin != null) bits.push(elapsedMin + ' min elapsed');
  // Correction #6: qualify so a mixed workout with a run block doesn't imply total completion.
  if(total > 0) bits.push(done + ' / ' + total + ' strength sets');
  return bits.length ? `<div class="tiny muted" style="margin-bottom:8px">${bits.map(escapeHtml).join(' · ')}</div>` : '';
}

// Execution UI for a strength block. Renders completed sets with checkmark + rest-timer chrome,
// and pending sets with weight/reps inputs + Complete button. No unit is invented — inputs use
// the JSON weightUnit verbatim, or omit the label when weightUnit is absent.
function _wkStrengthBlockExecution(block, active){
  const exs = Array.isArray(block.exercises) ? block.exercises : [];
  return `<div style="margin-bottom:14px">
    <h2 class="gf-section" style="margin-top:6px">${escapeHtml(block.title || 'Strength')}</h2>
    ${exs.map(ex => {
      const exId = ex.id || ex.name || 'unknown';
      const targetSets = ex.sets || 1;
      const er = active.exerciseResults ? active.exerciseResults.find(x => x.exerciseId === exId) : null;
      const doneSets = er ? er.sets : [];
      const repsRange = (ex.repsMin != null && ex.repsMax != null) ? `${ex.repsMin}-${ex.repsMax}` : (ex.reps != null ? String(ex.reps) : '—');
      const summaryBits = [`${ex.sets != null ? ex.sets : '?'} × ${repsRange} reps`];
      if(ex.targetRpe != null) summaryBits.push('Target RPE ' + ex.targetRpe);
      if(ex.repsInReserve != null) summaryBits.push(ex.repsInReserve + ' RIR');
      if(ex.restSec != null) summaryBits.push('Rest ' + _wkFmtSec(ex.restSec));
      // Prescribed weight (Correction #2 rules apply here too — no fallback unit)
      if(ex.prescribedWeight != null){
        summaryBits.push('Prescribed ' + ex.prescribedWeight + (ex.weightUnit ? ' ' + ex.weightUnit : ''));
      }
      // FIX 4: single-line clamp; long notes expandable
      const notes = ex.notes ? `<details style="margin-top:4px"><summary class="tiny muted" style="cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;max-width:100%">${escapeHtml(ex.notes.length > 60 ? ex.notes.slice(0,60) + '…' : ex.notes)}</summary><div class="tiny muted" style="padding:4px 0 0;line-height:1.4">${escapeHtml(ex.notes)}</div></details>` : '';
      const setRows = [];
      for(let n = 1; n <= targetSets; n++){
        const done = doneSets.find(s => s.setNumber === n);
        if(done){
          // Editing this set? Swap to inline edit form; input prefill = current stored values.
          const editing = state.workout && state.workout.ui && state.workout.ui.editingSet
            && state.workout.ui.editingSet.exId === exId && state.workout.ui.editingSet.setN === n;
          if(editing){
            const resolvedUnit = _wkResolveWeightUnit(ex.weightUnit);
            setRows.push(`
              <div class="wk-set-row" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="padding:10px 0;border-top:1px solid var(--border-l)">
                <div style="font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Set ${n} — editing</div>
                <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:8px">
                  <div style="flex:1;display:flex;align-items:baseline;gap:6px;padding:10px 12px;background:var(--surface-cream);border-radius:10px;min-width:0">
                    <input type="number" class="wk-set-edit-weight" data-exid="${escapeHtml(exId)}" data-setn="${n}" inputmode="decimal" step="0.5" value="${done.weight != null ? escapeHtml(String(done.weight)) : ''}" placeholder="wt" style="border:none;padding:0;font-size:16px;font-weight:700;background:transparent;width:100%;min-width:0">
                    <span class="tiny muted">${escapeHtml(resolvedUnit)}</span>
                  </div>
                  <div style="flex:1;display:flex;align-items:baseline;gap:6px;padding:10px 12px;background:var(--surface-cream);border-radius:10px;min-width:0">
                    <input type="number" class="wk-set-edit-reps" data-exid="${escapeHtml(exId)}" data-setn="${n}" inputmode="numeric" step="1" value="${done.reps != null ? escapeHtml(String(done.reps)) : ''}" placeholder="reps" style="border:none;padding:0;font-size:16px;font-weight:700;background:transparent;width:100%;min-width:0">
                  </div>
                </div>
                <div style="display:flex;gap:8px">
                  <button class="wk-set-edit-cancel btn btn-secondary" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="flex:1;padding:10px;font-size:13px">Cancel</button>
                  <button class="wk-set-edit-save btn btn-primary" data-exid="${escapeHtml(exId)}" data-setn="${n}" data-weightunit="${escapeHtml(resolvedUnit)}" style="flex:1;padding:10px;font-size:13px">Save</button>
                </div>
                ${done.editedAt ? '<div class="tiny faint" style="margin-top:6px">Last edited ' + escapeHtml(fmtDateTime(done.editedAt)) + '</div>' : ''}
              </div>`);
            continue;
          }
          const wDisp = done.weight != null ? `${done.weight}${done.weightUnit ? ' ' + escapeHtml(done.weightUnit) : ''}` : '—';
          const restRemainingMs = done.restEndsAt && done.restEndsAt > Date.now() ? done.restEndsAt - Date.now() : 0;
          const showRest = restRemainingMs > 0;
          setRows.push(`
            <div class="wk-set-row" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="padding:10px 0;border-top:1px solid var(--border-l)">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
                <div style="font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em">Set ${n}${done.editedAt ? ' · edited' : ''}</div>
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="font-weight:700;font-size:14px;color:var(--success)">✓ ${escapeHtml(wDisp)} × ${done.reps != null ? done.reps : '—'} reps</div>
                  <button class="wk-set-edit-trigger tiny" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="padding:4px 10px;background:var(--surface-cream);border:1px solid var(--border-l);border-radius:8px;font-weight:600;color:var(--muted)">Edit</button>
                </div>
              </div>
              ${showRest ? `
                <div class="wk-rest-row" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="margin-top:8px;padding:8px 10px;background:var(--surface-cream);border-radius:10px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="tiny" style="font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Rest</div>
                    <div class="wk-timer-display" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;text-align:center">${escapeHtml(_wkFmtSec(Math.ceil(restRemainingMs / 1000)))}</div>
                  </div>
                  <div style="display:flex;gap:6px;margin-top:6px">
                    <button class="wk-rest-minus tiny" data-exid="${escapeHtml(exId)}" data-setn="${n}" data-delta="-15" style="flex:1;padding:6px;background:var(--surface-white);border:1px solid var(--border);border-radius:8px;font-weight:600">-15</button>
                    <button class="wk-rest-plus tiny" data-exid="${escapeHtml(exId)}" data-setn="${n}" data-delta="15" style="flex:1;padding:6px;background:var(--surface-white);border:1px solid var(--border);border-radius:8px;font-weight:600">+15</button>
                    <button class="wk-add30 tiny" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="flex:1;padding:6px;background:var(--surface-white);border:1px solid var(--border);border-radius:8px;font-weight:600">+30</button>
                    <button class="wk-skip tiny" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="flex:1;padding:6px;background:var(--surface-white);border:1px solid var(--border);border-radius:8px;font-weight:600">Skip</button>
                  </div>
                </div>` : ''}
            </div>`);
        } else {
          // Prefill: last completed set's weight, else prescribed weight, else empty.
          let prefillW = '';
          if(doneSets.length > 0){
            const lastDone = doneSets[doneSets.length - 1];
            if(lastDone.weight != null) prefillW = lastDone.weight;
          } else if(ex.prescribedWeight != null){
            prefillW = ex.prescribedWeight;
          }
          setRows.push(`
            <div class="wk-set-row" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="padding:10px 0;border-top:1px solid var(--border-l)">
              <div style="font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Set ${n}</div>
              <div style="display:flex;gap:8px;align-items:stretch">
                <div style="flex:1;display:flex;align-items:baseline;gap:6px;padding:10px 12px;background:var(--surface-cream);border-radius:10px;min-width:0">
                  <input type="number" class="wk-set-weight" data-exid="${escapeHtml(exId)}" data-setn="${n}" inputmode="decimal" step="0.5" value="${escapeHtml(String(prefillW))}" placeholder="wt" style="border:none;padding:0;font-size:16px;font-weight:700;background:transparent;width:100%;min-width:0">
                  <span class="tiny muted">${escapeHtml(_wkResolveWeightUnit(ex.weightUnit))}</span>
                </div>
                <div style="flex:1;display:flex;align-items:baseline;gap:6px;padding:10px 12px;background:var(--surface-cream);border-radius:10px;min-width:0">
                  <input type="number" class="wk-set-reps" data-exid="${escapeHtml(exId)}" data-setn="${n}" inputmode="numeric" step="1" value="${escapeHtml(_wkDefaultReps(ex))}" placeholder="reps" style="border:none;padding:0;font-size:16px;font-weight:700;background:transparent;width:100%;min-width:0">
                </div>
              </div>
              <div style="display:flex;gap:8px;margin-top:8px">
                <button class="wk-complete btn btn-primary" data-exid="${escapeHtml(exId)}" data-setn="${n}" data-restsec="${ex.restSec != null ? ex.restSec : 0}" data-weightunit="${escapeHtml(_wkResolveWeightUnit(ex.weightUnit))}" style="flex:2;padding:10px 14px;font-size:13px">✓ Complete</button>
                <button class="wk-skip-set btn btn-secondary" data-exid="${escapeHtml(exId)}" data-setn="${n}" style="flex:1;padding:10px;font-size:13px">Skip</button>
              </div>
            </div>`);
        }
      }
      const anyPending = setRows.length > 0 && doneSets.length < targetSets;
      return `<div class="card-flat" style="padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <div style="font-weight:700;font-size:15px">${escapeHtml(ex.name || exId)}</div>
          ${anyPending ? `<button class="wk-skip-exercise tiny" data-exid="${escapeHtml(exId)}" data-total="${targetSets}" style="background:transparent;border:none;color:var(--muted);font-weight:600;cursor:pointer;padding:4px 8px">Skip exercise</button>` : ''}
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4">${escapeHtml(summaryBits.join(' · '))}</div>
        ${notes}
        ${setRows.join('')}
      </div>`;
    }).join('')}
    ${block.notes ? `<div class="tiny muted" style="padding:2px 4px;line-height:1.4">${escapeHtml(block.notes)}</div>` : ''}
  </div>`;
}

// ---- Phase 4: running-block execution (interval + continuous + walk) ----
// State model: state.workout.active.blockResults[] holds one entry per RUN block that's been
// started. Interval and continuous share the same timestamp-anchored timer field (segmentEndsAt)
// so _wkTick can drive both from one loop.
//
// Interval entry shape:
//   {blockId, type:'interval_run', status, startedAt, endedAt, isPaused, pausedRemainingMs,
//    segmentStartedAt, segmentEndsAt, currentRound, currentSegmentIndex, segments:[…history…]}
// segments[i]: {round, segmentIndex, activity, plannedDurationSec, actualDurationSec,
//               status:'completed'|'skipped', startedAt, endedAt}
//
// Continuous entry shape (continuous_run / easy_run / walk / treadmill_walk):
//   {blockId, type, status:'in_progress'|'completed'|'stopped_early', startedAt, endedAt,
//    isPaused, pausedRemainingMs, segmentEndsAt, plannedDurationSec, actualDurationSec,
//    distance, distanceUnit}

// Resolve the actual weight unit at set-completion time. Order of preference:
//   1) prescription's weightUnit (immutable per exercise)
//   2) user preference from state.config.useImperial (defaults to lb — matches N.A. gym convention)
// This is an explicit preference-based default, NOT an inference on the prescription itself.
// Pace helper — returns "M:SS /unit" given distance + duration + unit ('km' or 'mi').
// Returns '' when either input is missing or non-positive.
function _wkPaceStr(distance, durationSec, unit){
  if(distance == null || distance <= 0) return '';
  if(durationSec == null || durationSec <= 0) return '';
  const u = (unit === 'mi') ? 'mi' : 'km';
  const paceSec = durationSec / distance;   // seconds per unit
  if(!isFinite(paceSec) || paceSec <= 0) return '';
  const m = Math.floor(paceSec / 60);
  const s = Math.round(paceSec - m * 60);
  const ss = (s < 10 ? '0' : '') + s;
  return m + ':' + ss + ' /' + u;
}

// Effort label for the visible UI. Schema field remains sessionRpe / actualRpe.
function _wkEffortLabel(v){
  if(v == null) return '';
  return 'Effort ' + v + '/10';
}

// Format a paceSecPerKm integer as "M:SS /km". Empty when null/invalid.
function _wkPaceStrFromSec(paceSec){
  if(paceSec == null || !isFinite(paceSec) || paceSec <= 0) return '';
  const total = Math.round(paceSec);
  const m = Math.floor(total / 60);
  const s = total - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s + ' /km';
}
// Derived pace (sec/km) from distance (in unit) + duration.
function _wkDerivedPaceSec(distance, distanceUnit, durationSec){
  if(distance == null || distance <= 0 || durationSec == null || durationSec <= 0) return null;
  const km = (distanceUnit === 'mi') ? distance * 1.609344 : distance;
  if(km <= 0) return null;
  return durationSec / km;
}
// Split paceSecPerKm into {min, sec} for two-input UI.
function _wkPaceToMinSec(paceSec){
  if(paceSec == null || !isFinite(paceSec) || paceSec <= 0) return {min:'', sec:''};
  const total = Math.round(paceSec);
  const m = Math.floor(total / 60);
  const s = total - m * 60;
  return {min: String(m), sec: (s < 10 ? '0' : '') + s};
}
// Effective pace for display: prefer explicit paceSecPerKm, else derive from distance+duration.
function _wkEffectivePaceSec(br){
  if(!br) return null;
  if(br.paceSecPerKm != null) return br.paceSecPerKm;
  return _wkDerivedPaceSec(br.distance, br.distanceUnit, br.actualDurationSec);
}
function _wkEffectivePaceSecForSegment(seg){
  if(!seg) return null;
  if(seg.paceSecPerKm != null) return seg.paceSecPerKm;
  return _wkDerivedPaceSec(seg.distance, seg.distanceUnit, seg.actualDurationSec);
}

// Default reps input: use top of a range (10-12 -> 12, 8-10 -> 10), or the single value.
// Returns '' if no prescribed reps info.
function _wkDefaultReps(ex){
  if(!ex) return '';
  if(ex.repsMax != null) return String(ex.repsMax);
  if(ex.repsMin != null) return String(ex.repsMin);
  if(ex.reps != null){
    // ex.reps could be a number or a string like "10-12" or "10"
    if(typeof ex.reps === 'number') return String(ex.reps);
    const s = String(ex.reps);
    const range = s.match(/(\d+)\s*[-\u2013]\s*(\d+)/);
    if(range) return range[2];
    const single = s.match(/(\d+)/);
    if(single) return single[1];
  }
  return '';
}

function _wkResolveWeightUnit(prescriptionUnit){
  if(prescriptionUnit) return String(prescriptionUnit);
  if(state.config && state.config.useImperial === false) return 'kg';
  return 'lb';
}
function _wkResolveDistanceUnit(){
  // Metric-first: default to km unless the user explicitly opted into imperial.
  // Prescribed values in the JSON still override; this only sets the persistence default
  // for user-entered distance/speed with no unit context.
  if(state.config && state.config.useImperial === true) return 'mi';
  return 'km';
}

// Stable per-block key. Uses block.id when the prescription author provides it, else a
// positional key derived from the block's index in prescription.blocks.
function _wkBlockKey(block, idx){
  if(block && typeof block.id === 'string' && block.id) return block.id;
  return 'block-' + (typeof idx === 'number' ? idx : 0);
}
function _wkFindBlockByKey(active, blockId){
  const p = active && active.prescriptionSnapshot;
  if(!p || !Array.isArray(p.blocks)) return null;
  for(let i = 0; i < p.blocks.length; i++){
    if(_wkBlockKey(p.blocks[i], i) === blockId) return p.blocks[i];
  }
  return null;
}

// Structural validation for a persisted active session (Correction #5).
function _wkValidateActiveWorkout(a){
  if(!a || typeof a !== 'object') return {ok:false, reason:'not an object'};
  if(a.schemaVersion !== WORKOUT_SCHEMA_VERSION) return {ok:false, reason:'schemaVersion mismatch: ' + a.schemaVersion};
  if(typeof a.workoutId !== 'string' || !a.workoutId) return {ok:false, reason:'missing workoutId'};
  if(a.status !== 'in_progress') return {ok:false, reason:'status is not in_progress: ' + a.status};
  if(!a.prescriptionSnapshot || typeof a.prescriptionSnapshot !== 'object') return {ok:false, reason:'missing prescriptionSnapshot'};
  if(!Array.isArray(a.exerciseResults)) a.exerciseResults = [];
  if(!Array.isArray(a.blockResults)) a.blockResults = [];
  if(!Array.isArray(a.warmupResults)) a.warmupResults = [];
  if(!Array.isArray(a.cooldownResults)) a.cooldownResults = [];
  return {ok:true};
}

// Look up existing running-block result, or return null.
function _getBlockResult(active, blockId){
  if(!active || !Array.isArray(active.blockResults)) return null;
  return active.blockResults.find(x => x.blockId === blockId) || null;
}

// Initialize a new running block entry and persist. Timestamps are Date.now()-anchored so
// the timer state survives reloads, backgrounding, and re-renders.
function _wkStartRunBlock(blockId){
  const active = state.workout && state.workout.active;
  if(!active) return null;
  const block = _wkFindBlockByKey(active, blockId);
  if(!block) return null;
  const now = Date.now();
  // Remove any prior in-progress entry for this block (defensive dedupe)
  active.blockResults = (active.blockResults || []).filter(x => x.blockId !== blockId);
  if(block.type === 'interval_run'){
    const firstSeg = (block.segments && block.segments[0]) || null;
    const durMs = (firstSeg && firstSeg.durationSec ? firstSeg.durationSec : 0) * 1000;
    const br = {
      blockId, type: 'interval_run', status: 'in_progress',
      startedAt: nowIso(), endedAt: null,
      isPaused: false, pausedRemainingMs: null,
      currentRound: 1, currentSegmentIndex: 0,
      segmentStartedAt: nowIso(), segmentEndsAt: now + durMs,
      segments: []
    };
    active.blockResults.push(br);
    saveActiveWorkout(active);
    return br;
  }
  // continuous_run / easy_run / walk / treadmill_walk
  // Correction: track EXERCISE-ACTIVE time independently from wall-clock. activeElapsedMs
  // accumulates paused/resumed segments; segmentStartedAtMs is the anchor for the currently
  // running (non-paused) active segment. Paused time never contributes to actualDurationSec.
  const plannedSec = (block.durationMin != null)
    ? (block.durationMin * 60)
    : (block.durationSec != null ? block.durationSec : 0);
  const br = {
    blockId, type: block.type, status: 'in_progress',
    startedAt: nowIso(), endedAt: null,
    isPaused: false, pausedRemainingMs: null,
    plannedDurationSec: plannedSec,
    segmentStartedAt: nowIso(),                  // ISO — kept for compatibility / display
    segmentStartedAtMs: now,                     // NEW: ms anchor for the current active segment
    segmentEndsAt: now + plannedSec * 1000,
    activeElapsedMs: 0,                           // NEW: accumulated active-only time
    actualDurationSec: null,
    actualDurationSource: null,                   // 'timer' | 'user'
    completionSource: null,                       // 'timer_expired' | 'timer_expired_offline' | 'user_finished'
    distance: null, distanceUnit: null,
    speed: null, speedUnit: null,
    inclinePercent: null,
    actualRpe: null
  };
  active.blockResults.push(br);
  saveActiveWorkout(active);
  return br;
}

// Freeze remaining time. Idempotent on already-paused blocks.
// Correction: continuous-block pause accumulates its active-portion into activeElapsedMs and
// clears the live ms anchor. Paused time never contributes to actualDurationSec at finish.
function _wkPauseRunBlock(blockId){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const br = _getBlockResult(active, blockId);
  if(!br || br.isPaused || br.status !== 'in_progress' || !br.segmentEndsAt) return;
  const now = Date.now();
  br.pausedRemainingMs = Math.max(0, br.segmentEndsAt - now);
  br.isPaused = true;
  br.segmentEndsAt = null;
  if(br.type !== 'interval_run' && typeof br.segmentStartedAtMs === 'number'){
    br.activeElapsedMs = (br.activeElapsedMs || 0) + Math.max(0, now - br.segmentStartedAtMs);
    br.segmentStartedAtMs = null;
  }
  saveActiveWorkout(active);
}
// Resume from pause. endsAt = Date.now() + remainingMs. For continuous blocks, mark a fresh
// segmentStartedAtMs anchor so the next accumulate cycle only counts from here.
function _wkResumeRunBlock(blockId){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const br = _getBlockResult(active, blockId);
  if(!br || !br.isPaused) return;
  const now = Date.now();
  br.segmentEndsAt = now + (br.pausedRemainingMs || 0);
  br.pausedRemainingMs = null;
  br.isPaused = false;
  if(br.type !== 'interval_run'){
    br.segmentStartedAtMs = now;
  }
  saveActiveWorkout(active);
}

// Skip current interval segment. Records a partial 'skipped' history entry and advances.
function _wkSkipSegment(blockId){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const br = _getBlockResult(active, blockId);
  if(!br || br.status !== 'in_progress') return;
  const block = _wkFindBlockByKey(active, blockId);
  if(!block) return;
  const now = Date.now();
  if(br.type === 'interval_run'){
    const seg = (block.segments || [])[br.currentSegmentIndex] || {};
    const plannedSec = seg.durationSec || 0;
    // Compute active elapsed from remaining ms (handles pause/resume correctly because
    // segmentEndsAt is recomputed on resume and pausedRemainingMs holds paused-state remaining).
    let elapsedSec;
    if(br.isPaused){
      elapsedSec = Math.max(0, plannedSec - Math.round((br.pausedRemainingMs || 0) / 1000));
    } else if(br.segmentEndsAt){
      const remainingMs = Math.max(0, br.segmentEndsAt - now);
      elapsedSec = Math.max(0, plannedSec - Math.round(remainingMs / 1000));
    } else {
      elapsedSec = 0;
    }
    br.segments = br.segments || [];
    br.segments.push({
      round: br.currentRound,
      segmentIndex: br.currentSegmentIndex,
      activity: seg.activity || 'unknown',
      plannedDurationSec: plannedSec,
      actualDurationSec: Math.min(plannedSec, elapsedSec),
      status: 'skipped',
      startedAt: br.segmentStartedAt,
      endedAt: nowIso(),
      completionSource: 'skipped',
      actualDurationSource: 'timer'
    });
    _wkAdvanceIntervalAfterHistory(br, block, now);
  } else {
    // Skip = finish early for continuous variants.
    _wkFinishContinuous(active, br, now, /*userForced=*/true);
  }
  saveActiveWorkout(active);
}

// Advance interval to next segment / round / complete. Shared by natural expiry (via
// _wkAdvanceIntervalLive) and skip (via _wkSkipSegment) — pushes history before calling this.
function _wkAdvanceIntervalAfterHistory(br, block, now){
  const segCount = (block.segments || []).length;
  const roundCount = block.rounds || 1;
  const nextSegIdx = br.currentSegmentIndex + 1;
  if(nextSegIdx < segCount){
    br.currentSegmentIndex = nextSegIdx;
    const nextSeg = block.segments[nextSegIdx];
    br.segmentStartedAt = new Date(now).toISOString();
    br.segmentEndsAt = now + ((nextSeg && nextSeg.durationSec) ? nextSeg.durationSec : 0) * 1000;
    br.isPaused = false;
    br.pausedRemainingMs = null;
  } else if(br.currentRound < roundCount){
    br.currentRound += 1;
    br.currentSegmentIndex = 0;
    const nextSeg = block.segments[0];
    br.segmentStartedAt = new Date(now).toISOString();
    br.segmentEndsAt = now + ((nextSeg && nextSeg.durationSec) ? nextSeg.durationSec : 0) * 1000;
    br.isPaused = false;
    br.pausedRemainingMs = null;
  } else {
    br.status = 'completed';
    br.currentSegmentIndex = -1;
    br.segmentStartedAt = null;
    br.segmentEndsAt = null;
    br.endedAt = new Date(now).toISOString();
  }
}

// Natural interval segment expiry (live, in the tick loop). Records a 'completed' history entry
// then advances. Plays a modest audio/haptic cue.
function _wkAdvanceIntervalLive(active, br, block, now){
  const seg = (block.segments || [])[br.currentSegmentIndex] || {};
  const plannedSec = seg.durationSec || 0;
  br.segments = br.segments || [];
  br.segments.push({
    round: br.currentRound,
    segmentIndex: br.currentSegmentIndex,
    activity: seg.activity || 'unknown',
    plannedDurationSec: plannedSec,
    actualDurationSec: plannedSec,
    status: 'completed',
    startedAt: br.segmentStartedAt,
    endedAt: nowIso(),
    completionSource: 'timer_expired',
    actualDurationSource: 'timer'
  });
  _wkAdvanceIntervalAfterHistory(br, block, now);
  try{ nativeHaptic('medium'); }catch(e){}
  try{ beep(1000, 220); }catch(e){}
}
// Load-time normalization for interval blocks whose active segment expired while the app
// was closed. IMPORTANT (correction #5): we credit ONLY the segment that was already actively
// running when the app disappeared — capped at planned duration — and PAUSE the next
// segment so the user must explicitly resume. We do NOT chain-credit subsequent segments
// merely because wall-clock time passed; we have no evidence the user kept exercising.
function _wkAdvanceIntervalSilent(active, br, block, now){
  const seg = (block.segments || [])[br.currentSegmentIndex] || {};
  const plannedSec = seg.durationSec || 0;
  br.segments = br.segments || [];
  br.segments.push({
    round: br.currentRound,
    segmentIndex: br.currentSegmentIndex,
    activity: seg.activity || 'unknown',
    plannedDurationSec: plannedSec,
    actualDurationSec: plannedSec,   // capped at planned; app has no evidence of extended run
    status: 'completed',
    startedAt: br.segmentStartedAt,
    endedAt: new Date(br.segmentEndsAt || now).toISOString(),
    completionSource: 'timer_expired_offline',
    actualDurationSource: 'timer'
  });
  _wkAdvanceIntervalAfterHistory(br, block, now);
  // If the block is still in progress after advancing, PAUSE the newly-started segment with
  // its full planned duration. User must tap Resume to actually begin it.
  if(br.status === 'in_progress'){
    const nextSeg = (block.segments || [])[br.currentSegmentIndex] || {};
    const nextPlannedMs = (nextSeg.durationSec || 0) * 1000;
    br.pausedRemainingMs = nextPlannedMs;
    br.isPaused = true;
    br.segmentEndsAt = null;
    // segmentStartedAt (ISO) was already updated by _wkAdvanceIntervalAfterHistory; leave it.
  }
}

// Complete a continuous / walk / easy_run block.
// The two paths call in with different intent:
//   userForced=true  -> user tapped Finish; record whatever active time accumulated so far.
//   userForced=false -> natural timer expiry; record plannedDurationSec (do NOT credit any
//                       wall-clock time past planned; do NOT credit time while the app was
//                       closed and the timer expired).
function _wkFinishContinuous(active, br, now, userForced){
  // Compute active-only elapsed at this instant (active accumulated + current live portion).
  let activeMs = br.activeElapsedMs || 0;
  if(!br.isPaused && typeof br.segmentStartedAtMs === 'number'){
    activeMs += Math.max(0, now - br.segmentStartedAtMs);
  }
  if(userForced){
    // Stopped-early: record actual exercise-active time.
    br.actualDurationSec = Math.max(0, Math.round(activeMs / 1000));
    br.status = 'stopped_early';
    br.completionSource = 'user_finished';
  } else {
    // Natural timer expiry: record the prescribed duration. Do NOT use wall-clock elapsed.
    br.actualDurationSec = br.plannedDurationSec != null ? br.plannedDurationSec : Math.max(0, Math.round(activeMs / 1000));
    br.status = 'completed';
    br.completionSource = 'timer_expired';
  }
  br.actualDurationSource = 'timer';
  br.activeElapsedMs = activeMs;
  br.segmentStartedAtMs = null;
  br.endedAt = nowIso();
  br.segmentEndsAt = null;
  br.isPaused = false;
  br.pausedRemainingMs = null;
}
// Live natural completion — with audio cue.
function _wkCompleteContinuousLive(active, br, now){
  _wkFinishContinuous(active, br, now, false);
  try{ nativeHaptic('medium'); }catch(e){}
  try{ beep(1000, 220); }catch(e){}
}
// Silent variant for load-time normalization. Same natural-expiry rules as live path, but
// tagged 'timer_expired_offline' so ChatGPT downstream can distinguish app-closed expirations
// from cues delivered live.
function _wkCompleteContinuousSilent(active, br, now){
  _wkFinishContinuous(active, br, now, false);
  br.completionSource = 'timer_expired_offline';
  br.endedAt = br.segmentEndsAt ? new Date(br.segmentEndsAt).toISOString() : br.endedAt;
}
// User-forced Finish (from the button).
function _wkFinishContinuousUser(blockId){
  const active = state.workout && state.workout.active;
  if(!active) return;
  const br = _getBlockResult(active, blockId);
  if(!br || br.status !== 'in_progress') return;
  _wkFinishContinuous(active, br, Date.now(), true);
  saveActiveWorkout(active);
}

// Track distance changes on the continuous input. Numeric non-negative required; empty clears.
function _wkUpdateDistance(blockId, valueStr){
  const active = state.workout && state.workout.active;
  if(!active) return {ok:false, reason:'no active session'};
  const br = _getBlockResult(active, blockId);
  if(!br) return {ok:false, reason:'block not started'};
  const trimmed = String(valueStr == null ? '' : valueStr).trim();
  if(trimmed === ''){
    br.distance = null;
    br.distanceUnit = null;
    saveActiveWorkout(active);
    return {ok:true};
  }
  const val = parseFloat(trimmed);
  if(!isFinite(val) || val < 0){
    return {ok:false, reason:'Distance must be a non-negative number'};
  }
  br.distance = val;
  if(!br.distanceUnit) br.distanceUnit = _wkResolveDistanceUnit();
  saveActiveWorkout(active);
  return {ok:true};
}

// Renderer — interval run execution mode. Three states: not-started, in-progress, completed.
function _wkIntervalRunExecution(block, active, blockId){
  const br = _getBlockResult(active, blockId);
  const notStarted = !br;
  const completed = br && br.status === 'completed';
  const inProgress = br && br.status === 'in_progress';

  let body;
  if(notStarted){
    body = `<div class="card-flat" style="padding:14px">
      <div style="font-weight:700;font-size:14px;margin-bottom:8px">${escapeHtml(String(block.rounds != null ? block.rounds : '?'))} rounds</div>
      <div class="tiny muted" style="margin-bottom:12px;line-height:1.4">Tap Start to begin the interval clock. Segments will advance automatically. Stop conditions are shown below.</div>
      <button class="wk-block-start btn btn-primary btn-full" data-blockid="${escapeHtml(blockId)}">Start block</button>
    </div>`;
  } else if(completed){
    // Correction #12: allow the user to correct block-level actuals (distance, speed, incline,
    // RPE, aggregate duration). Per-segment editing is deferred; segments[] remains authoritative
    // for prescribed-vs-actual by segment. ChatGPT gets both signals.
    const editing = state.workout && state.workout.ui && state.workout.ui.editingBlock === blockId;
    if(editing){
      body = _wkBlockActualsEditForm(br, blockId);
    } else {
      const segs = br.segments || [];
      const cCount = segs.filter(s => s.status === 'completed').length;
      const sCount = segs.filter(s => s.status === 'skipped').length;
      const distStr = (br.distance != null) ? (br.distance + (br.distanceUnit ? ' ' + br.distanceUnit : '')) : '';
      const rpeStr = (br.actualRpe != null) ? _wkEffortLabel(br.actualRpe) : '';
      const extras = [distStr, rpeStr].filter(Boolean).join(' · ');
      body = `<div class="card-flat" style="padding:14px;background:var(--success-s);border:1px solid rgba(77,168,105,0.3)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
          <div style="font-weight:700;font-size:14px;color:var(--success)">✓ Block complete</div>
          <button class="wk-block-edit-trigger tiny" data-blockid="${escapeHtml(blockId)}" style="padding:4px 10px;background:var(--surface-white);border:1px solid var(--border-l);border-radius:8px;font-weight:600;color:var(--muted)">Edit actuals</button>
        </div>
        <div class="tiny muted">${cCount} completed${sCount > 0 ? ', ' + sCount + ' skipped' : ''}${extras ? ' · ' + escapeHtml(extras) : ''}</div>
      </div>`;
    }
  } else if(inProgress){
    const segs = block.segments || [];
    const curSeg = segs[br.currentSegmentIndex] || {};
    const remainingMs = br.isPaused
      ? (br.pausedRemainingMs || 0)
      : (br.segmentEndsAt ? Math.max(0, br.segmentEndsAt - Date.now()) : 0);
    const rpe = _wkRpeText(curSeg);
    const progressStrip = (br.segments || []).slice(-10).map(s => {
      const a = (s.activity === 'run' ? 'R' : (s.activity === 'walk' ? 'W' : '○'));
      return a + (s.status === 'skipped' ? '↷' : '✓');
    }).join(' ');
    body = `<div class="card-flat" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
